    tangentDrift: Math.cos(index * 7.9) * 0.28,
    speed: 0.09 + (index % 5) * 0.02,
    baseOpacity: 0.62 + (index % 3) * 0.08
  };
  receiverGroup.add(square);
  return square;
});

function disposeEditorRoutes() {
  while (editorRouteRoot.children.length) {
    const line = editorRouteRoot.children.pop();
    line.geometry?.dispose?.();
    line.material?.dispose?.();
  }
  editorRouteMaterials.clear();
}

function makeEditorRouteLine(points, colors, width, opacity) {
  const geometry = new LineGeometry();
  geometry.setPositions(points.flatMap((point) => point.toArray()));
  geometry.setColors(colors.flatMap((color) => color.toArray()));
  const material = new LineMaterial({
    color: 0xffffff,
    linewidth: width,
    vertexColors: true,
    transparent: true,
    opacity,
    depthWrite: false,
    depthTest: true,
    worldUnits: false
  });
  material.resolution.set(window.innerWidth, window.innerHeight);
  editorRouteMaterials.add(material);
  const line = new Line2(geometry, material);
  line.renderOrder = -10;
  line.computeLineDistances();
  editorRouteRoot.add(line);
}

function rebuildEditorRoutes() {
  disposeEditorRoutes();
  if (!editorPreviewMode || !chartState.receiverTrajectory) return;
  const duration = Math.max(0.001, timingConfig.chartDuration);
  const previewConfig = gameConfig.editorPreview;
  const step = Math.max(previewConfig.routeMinSampleSeconds, duration / previewConfig.routeMaxSegments);
  const sideLaneOffset = Number.isFinite(playfieldConfig.sideLaneOffset)
    ? playfieldConfig.sideLaneOffset
    : playfieldConfig.sideLaneX;
  const center = [];
  const left = [];
  const right = [];
  const speeds = [];
  for (let time = 0; time < duration; time += step) {
    const pose = sampleReceiverPose(time);
    const position = pose.position.clone();
    const lateral = new THREE.Vector3(1, 0, 0).applyQuaternion(pose.quaternion).normalize();
    center.push(position);
    left.push(position.clone().addScaledVector(lateral, -sideLaneOffset));
    right.push(position.clone().addScaledVector(lateral, sideLaneOffset));
    const previous = center[center.length - 2];
    speeds.push(previous ? position.distanceTo(previous) / step : 0);
  }
  const finalPose = sampleReceiverPose(duration);
  const finalPosition = finalPose.position.clone();
  const finalLateral = new THREE.Vector3(1, 0, 0).applyQuaternion(finalPose.quaternion).normalize();
  center.push(finalPosition);
  left.push(finalPosition.clone().addScaledVector(finalLateral, -sideLaneOffset));
  right.push(finalPosition.clone().addScaledVector(finalLateral, sideLaneOffset));
  speeds.push(speeds.at(-1) ?? 0);

  const minSpeed = Math.min(...speeds);
  const maxSpeed = Math.max(...speeds);
  const speedRange = Math.max(0.0001, maxSpeed - minSpeed);
  const slowColor = new THREE.Color(colorConfig.speedSlow);
  const fastColor = new THREE.Color(colorConfig.speedFast);
  const speedColors = speeds.map((speed) => slowColor.clone().lerp(fastColor, (speed - minSpeed) / speedRange));
  const leftColors = left.map(() => palette.left);
  const rightColors = right.map(() => palette.right);
  makeEditorRouteLine(center, speedColors, previewConfig.centerRouteWidth, previewConfig.centerRouteOpacity);
  makeEditorRouteLine(left, leftColors, previewConfig.sideRouteWidth, previewConfig.sideRouteOpacity);
  makeEditorRouteLine(right, rightColors, previewConfig.sideRouteWidth, previewConfig.sideRouteOpacity);

  const bounds = new THREE.Box3().setFromPoints([...center, ...left, ...right]);
  bounds.getBoundingSphere(editorRouteBounds);
  editorRouteRoot.visible = editorPreviewView === "free";
}

function frameEditorFreeCamera() {
  const target = receiverState.anchor.clone();
  const viewDirection = camera.position.clone().sub(target);
  if (viewDirection.lengthSq() < 0.000001) viewDirection.set(0, 0, 1);
  const previewConfig = gameConfig.editorPreview;
  const initialDistance = Math.max(
    previewConfig.initialDistance,
    playfieldConfig.receiverRadius * previewConfig.receiverDistanceScale
  );
  camera.position.copy(target).addScaledVector(viewDirection.normalize(), initialDistance);
  camera.up.set(0, 1, 0);
  controls.target.copy(target);
  configureEditorFreeCameraLimits(target, initialDistance);
  controls.update();
}

function configureEditorFreeCameraLimits(target = controls.target, minimumMaximum = 0) {
  const previewConfig = gameConfig.editorPreview;
  controls.minDistance = Math.max(1, playfieldConfig.receiverRadius * previewConfig.minOrbitDistanceScale);
  const trajectoryExtent = editorRouteBounds.center.distanceTo(target) + editorRouteBounds.radius;
  const fullTrajectoryDistance = trajectoryExtent > 0
    ? trajectoryExtent / Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * previewConfig.fullRouteFitMargin
    : minimumMaximum;
  controls.maxDistance = Math.max(
    previewConfig.minimumMaxDistance,
    minimumMaximum * previewConfig.preservedDistanceMaxScale,
    fullTrajectoryDistance
  );
  camera.near = 0.1;
  camera.far = Math.max(cameraProfile.far, controls.maxDistance * previewConfig.farPlaneDistanceScale);
  camera.updateProjectionMatrix();
}

function setEditorPreviewView(view) {
  editorPreviewView = view === "free" ? "free" : "play";
  const free = editorPreviewView === "free";
  scene.fog = free ? null : playSceneFog;
  editorRouteRoot.visible = free;
  setFreeCamera(free);
  if (free) frameEditorFreeCamera();
}

loadChart(createDemoChart());

function setFreeCamera(enabled) {
  debugFreeCamera = Boolean(enabled);
  controls.enabled = debugFreeCamera;
  cameraModeReadout.textContent = debugFreeCamera ? "free" : "play";
  if (!debugFreeCamera) {
    camera.up.set(0, 1, 0);
    const cameraOffset = currentCameraOffset();
    const target = applyCameraProfile(0, 0, receiverState.anchor, receiverState.currentQuaternion, cameraOffset);
    controls.target.copy(target);
    controls.update();
  }
}

window.ParticleSoar = {
  loadChart,
  sampleReceiverPose,
  cameraProfile,
  timingConfig,
  playfieldConfig,
  judgementConfig,
  gameplayState,
  setFreeCamera,
  setEditorPreviewTime,
  setEditorPreviewActive,
  getLiveChartTime,
  resetGameplayState
};

if (editorPreviewMode) {
  window.addEventListener("message", (event) => {
    if (event.origin !== window.location.origin || event.source !== window.parent) return;
    if (event.data?.type === "ParticleSoarPreviewHello") {
      window.parent.postMessage({ type: "ParticleSoarPreviewReady" }, window.location.origin);
    } else if (event.data?.type === "ParticleSoarPreviewChart") {
      const freeCameraState = editorPreviewView === "free" ? {
        position: camera.position.clone(),
        up: camera.up.clone(),
        target: controls.target.clone()
      } : null;
      setEditorPreviewTime(event.data.time);
      loadChart(event.data.chart);
      if (freeCameraState) {
        editorPreviewView = "free";
        scene.fog = null;
        editorRouteRoot.visible = true;
        setFreeCamera(true);
        camera.position.copy(freeCameraState.position);
        camera.up.copy(freeCameraState.up);
        controls.target.copy(freeCameraState.target);
        configureEditorFreeCameraLimits(controls.target, camera.position.distanceTo(controls.target));
        controls.update();
      } else {
        setEditorPreviewView("play");
      }
      setEditorPreviewTime(event.data.time);
    } else if (event.data?.type === "ParticleSoarPreviewTime") {
      setEditorPreviewTime(event.data.time);
    } else if (event.data?.type === "ParticleSoarPreviewView") {
      setEditorPreviewView(event.data.view);
    } else if (event.data?.type === "ParticleSoarPreviewActive") {
      setEditorPreviewActive(event.data.active);
    }
  });
  window.parent.postMessage({ type: "ParticleSoarPreviewReady" }, window.location.origin);
}

const leftKeyCodes = new Set(gameConfig.input.left);
const rightKeyCodes = new Set(gameConfig.input.right);
const middleKeyCodes = new Set(gameConfig.input.middle);
const topKeyCodes = new Set(gameConfig.input.top);

const gameplayKeyCodes = new Set([
  ...leftKeyCodes,
  ...rightKeyCodes,
  ...middleKeyCodes,
  ...topKeyCodes,
  ...gameConfig.input.space
]);

const judgementOrder = ["flawless", "prime", "decent", "loose"];

function normalizeChartTime(chartTime) {
  const duration = timingConfig.chartDuration;
  return ((chartTime % duration) + duration) % duration;
}

function getLiveChartTime() {
  if (chartState.previewTime !== null) {
    return THREE.MathUtils.clamp(chartState.previewTime, 0, timingConfig.chartDuration);
  }
  return normalizeChartTime(clock.getElapsedTime() - chartState.startTime);
}

function setEditorPreviewTime(chartTime) {
  chartState.previewTime = Number.isFinite(Number(chartTime)) ? Number(chartTime) : 0;
}

function setEditorPreviewActive(active) {
  editorPreviewActive = Boolean(active);
}

function getJudgeChartTime() {
  return normalizeChartTime(getLiveChartTime() + judgementConfig.inputOffsetSeconds);
}

function currentJudgementWindows() {
  return judgementConfig.windows[judgementConfig.mode] ?? judgementConfig.windows.ordinary;
}

function judgementForGap(timeGap) {
  const gap = Math.abs(timeGap);
  const windows = currentJudgementWindows();
  for (const judgement of judgementOrder) {
    if (gap <= windows[judgement]) return judgement;
  }
  return "hollow";
}

function inputTypeForNote(note) {
  if (isTopNote(note)) return "top";
  if (isSpaceNote(note)) return "space";
  if (isSideNote(note)) return baseNoteType(note);
  if (isMiddleNote(note)) return "middle";
  return null;
}

function noteVisualHead(note) {
  return isHoldNote(note) ? note.mesh.userData.head : note.mesh;
}

function flashJudgedNote(note) {
  const head = noteVisualHead(note);
  if (head) head.userData.hitFlash = 1;
}

function forEachNoteVisualMaterial(note, callback) {
  noteVisualHead(note)?.traverse((object) => {
    const materials = Array.isArray(object.material) ? object.material : [object.material];
    materials.forEach((material) => {
      if (material?.color) callback(material);
    });
  });
}

function restoreNoteVisualColor(note) {
  forEachNoteVisualMaterial(note, (material) => {
    const baseColor = material.userData.judgementBaseColor;
    if (baseColor) material.color.copy(baseColor);
  });
}

function applyEarlyLooseVisual(note, judgement, judgeChartTime) {
  const offsetSeconds = note.headOffsetSeconds ?? judgeChartTime - note.hitTime;
  if (judgement !== "loose" || offsetSeconds >= 0 || note.earlyLoose) return;
  note.earlyLoose = true;
  note.capturedAtChartTime = judgeChartTime;
  forEachNoteVisualMaterial(note, (material) => material.color.setRGB(1, 0, 0));
}

function showJudgementFeedback(judgement) {
  gameplayState.feedbackUntil = clock.getElapsedTime() + 0.65;
  logicStateReadout.textContent = judgement.toUpperCase();
}

function clearHoldBindings(note) {
  note.holdKeyCodes.forEach((code) => {
    const boundHolds = gameplayState.holdsByKeyCode.get(code);
    if (!boundHolds) return;
    boundHolds.delete(note);
    if (boundHolds.size === 0) gameplayState.holdsByKeyCode.delete(code);
  });
  note.holdKeyCodes.clear();
  note.emptySinceChartTime = null;
}

function roundScoreLikeCapSonik(value) {
  const lower = Math.floor(value);
  const fraction = value - lower;
  if (Math.abs(fraction - 0.5) < Number.EPSILON * Math.max(1, value)) {
    return lower % 2 === 0 ? lower : lower + 1;
  }
  return Math.round(value);
}

function updateScore(judgement, note) {
  const successful = judgement === "flawless" || judgement === "prime" || judgement === "decent";
  if (!successful) {
    gameplayState.comboPunishmentCount = scoringConfig.maxComboPunishment;
    scoreCountReadout.textContent = String(roundScoreLikeCapSonik(gameplayState.score))
      .padStart(gameConfig.ui.scoreDigits, "0");
    return;
  }

  const totalWeight = gameplayState.weightedNoteCount;
  const weight = Math.max(0, Number(note.scoreWeight) || 0);
  const basePool = judgement === "flawless"
    ? scoringConfig.flawlessPool
    : judgement === "prime"
      ? scoringConfig.primePool
      : scoringConfig.primePool * scoringConfig.decentRatio;
  const comboRecovery = 1 - gameplayState.comboPunishmentCount / scoringConfig.maxComboPunishment;
  const comboPool = scoringConfig.comboPool * comboRecovery;
  gameplayState.score += ((basePool + comboPool) / totalWeight) * weight;
  if (gameplayState.comboPunishmentCount > 0) gameplayState.comboPunishmentCount -= 1;
  scoreCountReadout.textContent = String(roundScoreLikeCapSonik(gameplayState.score))
    .padStart(gameConfig.ui.scoreDigits, "0");
}

function registerProgressMarker(chartTime, judgement) {
  if (judgement !== "decent" && judgement !== "loose" && judgement !== "hollow") return;
  const marker = document.createElement("span");
  marker.className = `song-progress-marker ${judgement}`;
  marker.style.left = `${THREE.MathUtils.clamp(chartTime / Math.max(timingConfig.chartDuration, 0.001), 0, 1) * 100}%`;
  songProgressMarkers.appendChild(marker);
}

function finalizeNote(note, judgement, judgeChartTime) {
  if (note.judgementStatus === "judged") return;
  if (isHoldNote(note)) {
    gameplayState.activeHolds.delete(note);
    clearHoldBindings(note);
  }

  note.judgementStatus = "judged";
  note.judgement = judgement;
  note.judged = true;
  note.hit = judgement === "flawless" || judgement === "prime" || judgement === "decent";
  applyEarlyLooseVisual(note, judgement, judgeChartTime);
  const captured = judgement !== "hollow";
  if (captured) {
    flashJudgedNote(note);
    if (!isHoldNote(note)) {
      note.capturedAtChartTime = judgeChartTime;
      if (judgement !== "loose") spawnHitEffect(note);
    }
  }
  showJudgementFeedback(judgement);

  gameplayState.counts[judgement] += 1;
  registerProgressMarker(judgeChartTime, judgement);
  updateScore(judgement, note);
  if (note.hit) {
    gameplayState.combo += 1;
    gameplayState.maxCombo = Math.max(gameplayState.maxCombo, gameplayState.combo);
  } else {
    gameplayState.combo = 0;
  }
  comboCountReadout.textContent = String(gameplayState.combo);
  gameplayState.judgementHistory.push({
    note,
    judgement,
    judgedAt: judgeChartTime,
    offsetSeconds: note.headOffsetSeconds ?? judgeChartTime - note.hitTime
  });
}

function bindKeyToHold(note, code) {
  note.holdKeyCodes.add(code);
  note.emptySinceChartTime = null;
  if (!gameplayState.holdsByKeyCode.has(code)) gameplayState.holdsByKeyCode.set(code, new Set());
  gameplayState.holdsByKeyCode.get(code).add(note);
}

function beginHold(note, judgement, judgeChartTime, code) {
  note.judgementStatus = "holding";
  note.judgement = judgement;
  note.judged = true;
  note.hit = true;
  note.headOffsetSeconds = judgeChartTime - note.hitTime;
  applyEarlyLooseVisual(note, judgement, judgeChartTime);
  gameplayState.activeHolds.add(note);
  bindKeyToHold(note, code);
  flashJudgedNote(note);
  if (judgement !== "loose") spawnHitEffect(note);
  showJudgementFeedback(judgement);
}

function rebuildJudgementQueues() {
  gameplayState.noteQueues.clear();
  notes.forEach((note) => {
    const inputType = inputTypeForNote(note);
    if (!inputType) return;
    if (!gameplayState.noteQueues.has(inputType)) {
      gameplayState.noteQueues.set(inputType, { notes: [], cursor: 0 });
    }
    gameplayState.noteQueues.get(inputType).notes.push(note);
  });
  gameplayState.noteQueues.forEach((queue) => {
    queue.notes.sort((a, b) => a.hitTime - b.hitTime || (a.wPos ?? 0) - (b.wPos ?? 0));
  });
}

function advanceJudgementCursor(queue) {
  while (
    queue.cursor < queue.notes.length
    && queue.notes[queue.cursor].judgementStatus !== "pending"
  ) {
    queue.cursor += 1;
  }
}

function resetGameplayState() {
  gameplayState.activeHolds.clear();
  gameplayState.holdsByKeyCode.clear();
  gameplayState.judgementHistory.length = 0;
  Object.keys(gameplayState.counts).forEach((key) => {
    gameplayState.counts[key] = 0;
  });
  gameplayState.combo = 0;
  gameplayState.maxCombo = 0;
  gameplayState.score = 0;
  gameplayState.comboPunishmentCount = 0;
  gameplayState.lastChartTime = 0;
  gameplayState.feedbackUntil = 0;
  comboCountReadout.textContent = "0";
  scoreCountReadout.textContent = "0".repeat(gameConfig.ui.scoreDigits);
  songProgressMarkers.replaceChildren();
  resetHitEffects();
  notes.forEach((note) => {
    note.judged = false;
    note.hit = false;
    note.judgementStatus = "pending";
    note.judgement = null;
    note.earlyLoose = false;
    note.capturedAtChartTime = null;
    note.headOffsetSeconds = null;
    note.holdKeyCodes.clear();
    note.emptySinceChartTime = null;
    const head = noteVisualHead(note);
    if (head) head.userData.hitFlash = 0;
    restoreNoteVisualColor(note);
  });
  rebuildJudgementQueues();
  logicStateReadout.textContent = "on";
}

function attachKeyToActiveHolds(inputType, code, judgeChartTime) {
  const decentWindow = currentJudgementWindows().decent;
  gameplayState.activeHolds.forEach((hold) => {
    if (hold.judgementStatus !== "holding" || inputTypeForNote(hold) !== inputType) return;
    if (Math.abs(hold.hitTime - judgeChartTime) > decentWindow) return;
    bindKeyToHold(hold, code);
  });
}

function tryJudgeInputType(inputType, code, judgeChartTime) {
  const queue = gameplayState.noteQueues.get(inputType);
  if (!queue) return false;
  advanceJudgementCursor(queue);
  if (queue.cursor >= queue.notes.length) return false;

  let candidate = queue.notes[queue.cursor];
  let judgement = judgementForGap(candidate.hitTime - judgeChartTime);
  if (candidate.hitTime > judgeChartTime && judgement === "hollow") return false;

  if (candidate.hitTime < judgeChartTime && judgement === "decent") {
    for (let i = queue.cursor + 1; i < queue.notes.length; i += 1) {
      const nextCandidate = queue.notes[i];
      if (nextCandidate.judgementStatus !== "pending") continue;
      if (nextCandidate.hitTime >= judgeChartTime) break;
      const nextJudgement = judgementForGap(nextCandidate.hitTime - judgeChartTime);
      if (nextJudgement === "flawless" || nextJudgement === "prime") {
        candidate = nextCandidate;
        judgement = nextJudgement;
        break;
      }
    }
  }

  if (judgement === "hollow") return false;
  if (isHoldNote(candidate)) {
    beginHold(candidate, judgement, judgeChartTime, code);
  } else {
    finalizeNote(candidate, judgement, judgeChartTime);
  }
  return true;
}

function inputTypesForCode(code) {
  if (code === "Space") return ["space"];
  if (leftKeyCodes.has(code)) return ["left"];
  if (rightKeyCodes.has(code)) return ["right"];
  if (topKeyCodes.has(code)) return ["top", "middle"];
  if (middleKeyCodes.has(code)) return ["middle"];
  return [];
}

function releaseGameplayKey(code, judgeChartTime) {
  const boundHolds = gameplayState.holdsByKeyCode.get(code);
  if (!boundHolds) return;
  [...boundHolds].forEach((hold) => {
    hold.holdKeyCodes.delete(code);
    if (hold.holdKeyCodes.size === 0) hold.emptySinceChartTime = judgeChartTime;
  });
  gameplayState.holdsByKeyCode.delete(code);
}

function releaseAllGameplayKeys(judgeChartTime) {
  [...gameplayState.holdsByKeyCode.keys()].forEach((code) => {
    releaseGameplayKey(code, judgeChartTime);
  });
}

function updateActiveHolds(chartTime) {
  const windows = currentJudgementWindows();
  [...gameplayState.activeHolds].forEach((hold) => {
    if (hold.judgementStatus === "holding") {
      if (hold.endTime <= chartTime + windows.prime) {
        hold.judgementStatus = "completed";
        clearHoldBindings(hold);
      } else if (hold.holdKeyCodes.size === 0 && hold.emptySinceChartTime !== null) {
        if (hold.endTime <= hold.emptySinceChartTime + windows.decent) {
          hold.judgement = "decent";
          hold.judgementStatus = "completed";
          clearHoldBindings(hold);
        } else {
          finalizeNote(hold, "hollow", hold.emptySinceChartTime);
          return;
        }
      }
    }
    if (hold.judgementStatus === "completed" && hold.endTime <= chartTime) {
      finalizeNote(hold, hold.judgement, chartTime);
    }
  });
}

function updateJudgementState(chartTime) {
  const looseWindow = currentJudgementWindows().loose;
  gameplayState.noteQueues.forEach((queue) => {
    advanceJudgementCursor(queue);
    while (
      queue.cursor < queue.notes.length
      && queue.notes[queue.cursor].hitTime < chartTime - looseWindow
    ) {
      finalizeNote(queue.notes[queue.cursor], "hollow", chartTime);
      advanceJudgementCursor(queue);
    }
  });
  updateActiveHolds(chartTime);
}

function syncGameplayCycle(chartTime) {
  if (chartTime + 0.001 < gameplayState.lastChartTime) resetGameplayState();
  gameplayState.lastChartTime = chartTime;
}

function advanceGameplay(chartTime) {
  syncGameplayCycle(chartTime);
  updateJudgementState(chartTime);
}

window.addEventListener("keydown", (event) => {
  if (editorPreviewMode) {
    if (event.code === "Equal") {
      event.preventDefault();
      if (event.repeat) return;
      window.parent.postMessage({ type: "ParticleSoarEditorToggleView" }, window.location.origin);
    } else if (event.code === "KeyE") {
      event.preventDefault();
      if (event.repeat) return;
      window.parent.postMessage({ type: "ParticleSoarEditorTogglePanel" }, window.location.origin);
    }
    return;
  }
  if (event.code === "Equal") {
    event.preventDefault();
    if (event.repeat) return;
    setFreeCamera(!debugFreeCamera);
    return;
  }
  if (!gameplayKeyCodes.has(event.code)) return;
  event.preventDefault();
  if (event.repeat) return;

  const judgeChartTime = getJudgeChartTime();
  syncGameplayCycle(judgeChartTime);
  const inputTypes = inputTypesForCode(event.code);
  inputTypes.forEach((inputType) => {
    attachKeyToActiveHolds(inputType, event.code, judgeChartTime);
  });
  updateJudgementState(judgeChartTime);
  for (const inputType of inputTypes) {
    if (tryJudgeInputType(inputType, event.code, judgeChartTime)) break;
  }
});

window.addEventListener("keyup", (event) => {
  if (editorPreviewMode) return;
  if (!gameplayKeyCodes.has(event.code)) return;
  event.preventDefault();
  releaseGameplayKey(event.code, getJudgeChartTime());
});

window.addEventListener("blur", () => {
  releaseAllGameplayKeys(getJudgeChartTime());
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) releaseAllGameplayKeys(getJudgeChartTime());
});

function easeInCubic(t) {
  return t * t * t;
}

function smoothstep(edge0, edge1, value) {
  const x = THREE.MathUtils.clamp((value - edge0) / (edge1 - edge0), 0, 1);
  return x * x * (3 - 2 * x);
}

function postHitVisibility(timeToHit) {
  if (timeToHit >= 0) return 1;
  return smoothstep(-timingConfig.postHitFadeSeconds, 0, timeToHit);
}

function noteVisibility(progress, timeToHit) {
  const fadeIn = smoothstep(0.0, 0.12, progress);
  return fadeIn * postHitVisibility(timeToHit);
}

function capturedNoteVisibility(note, chartTime) {
  if (note.capturedAtChartTime === null) return 1;
  let elapsed = chartTime - note.capturedAtChartTime;
  if (elapsed < 0) elapsed += timingConfig.chartDuration;
  const fadeSeconds = note.earlyLoose ? 0.22 : 0.09;
  return 1 - smoothstep(0, fadeSeconds, elapsed);
}

function holdVisibility(headProgress, tailTimeToHit) {
  const fadeIn = smoothstep(0.0, 0.12, headProgress);
  return fadeIn * postHitVisibility(tailTimeToHit);
}

function holdStateOpacity(note) {
  return note.judgementStatus === "judged" && note.judgement === "hollow" ? 0.2 : 1;
}

function noteTravelFactor(progress) {
  return progress <= 1
    ? easeInCubic(THREE.MathUtils.clamp(progress, 0, 1))
    : 1 + 3 * (progress - 1);
}

function timeUntilHit(hitTime, chartTime, wrap = true) {
  let dt = hitTime - chartTime;
  if (wrap && dt < -timingConfig.postHitSeconds) dt += timingConfig.chartDuration;
  return dt;
}

function notePointAtHitTime(note, hitTime, chartTime, wrap = true) {
  const timeToHit = timeUntilHit(hitTime, chartTime, wrap);
  const travelSeconds = note.startPosition.distanceTo(note.hitPosition) / currentFlowSpeed();
  const p = 1 - timeToHit / travelSeconds;
  const factor = noteTravelFactor(p);
  const x = THREE.MathUtils.lerp(note.startPosition.x, note.hitPosition.x, factor);
  const y = THREE.MathUtils.lerp(note.startPosition.y, note.hitPosition.y, factor);
  const z = THREE.MathUtils.lerp(note.startPosition.z, note.hitPosition.z, factor);
  return { position: new THREE.Vector3(x, y, z), progress: p, timeToHit };
}

function notePosition(note, chartTime) {
  if (chartState.motionMode === "receiver-catch") {
    const timeToHit = timeUntilHit(note.hitTime, chartTime);
    const p = 1 - timeToHit / timingConfig.staticNoteLeadSeconds;
    return { position: note.hitPosition.clone(), progress: p, timeToHit };
  }
  return notePointAtHitTime(note, note.hitTime, chartTime);
}

function buildHoldTrajectory(note) {
  if (chartState.motionMode !== "receiver-catch" || note.endTime <= note.hitTime) return null;
  return Object.freeze({
    startTime: note.hitTime,
    endTime: note.endTime
  });
}

function holdSegment(note, chartTime) {
  if (chartState.motionMode === "receiver-catch") {
    const headTimeToHit = timeUntilHit(note.hitTime, chartTime, false);
    const tailTimeToHit = timeUntilHit(note.endTime, chartTime, false);
    const activeHead = headTimeToHit <= 0 && tailTimeToHit >= -timingConfig.postHitSeconds;
    const headTransform = activeHead ? getLandingHintTransform(note) : null;
    const tailTransform = tailTimeToHit <= 0 ? getLandingHintTransform(note) : null;
    return {
      head: {
        position: headTransform ? headTransform.position : note.hitPosition.clone(),
        progress: 1 - headTimeToHit / timingConfig.staticNoteLeadSeconds,
        timeToHit: headTimeToHit
      },
      tail: {
        position: tailTransform ? tailTransform.position : note.tailHitPosition.clone(),
        progress: 1 - tailTimeToHit / timingConfig.staticNoteLeadSeconds,
        timeToHit: tailTimeToHit
      },
      progress: 1 - headTimeToHit / timingConfig.staticNoteLeadSeconds,
      timeToHit: headTimeToHit,
      trajectoryStartTime: activeHead ? chartTime : note.hitTime
    };
  }
  const head = notePointAtHitTime(note, note.hitTime, chartTime, false);
  const tail = notePointAtHitTime(note, note.endTime, chartTime, false);
  if (head.progress > 1) {
    head.position.copy(note.hitPosition);
  }
  return {
    head,
    tail,
    progress: head.progress,
    timeToHit: head.timeToHit
  };
}

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
  editorRouteMaterials.forEach((material) => material.resolution.set(w, h));
}
window.addEventListener("resize", resize);

function formatVector(v) {
  return `${v.x.toFixed(3)}, ${v.y.toFixed(3)}, ${v.z.toFixed(3)}`;
}

function updateCameraDebug() {
  cameraPositionReadout.textContent = formatVector(camera.position);
  cameraTargetReadout.textContent = formatVector(controls.target);
  cameraFovReadout.textContent = camera.fov.toFixed(2);
  backgroundCountReadout.textContent = `${particleGeo.drawRange.count} points / ${backgroundTriangleMesh.count} triangles`;
}

function setObjectOpacity(object, opacity) {
  object.traverse((child) => {
    if (child.material) child.material.opacity = opacity * (child.userData.opacityScale ?? 1);
  });
}

function updateSphereNoteVisual(mesh, opacity, scale, hitFlash = 0) {
  const halo = mesh.userData.halo;
  mesh.scale.setScalar(scale * (1 + hitFlash * 0.16));
  setObjectOpacity(mesh, opacity);
  mesh.visible = true;
  if (halo) {
    halo.visible = opacity > 0.02;
    halo.material.opacity = opacity * halo.userData.baseOpacity;
    halo.scale.setScalar(middleHaloScale);
  }
}

function updateSpaceSatellites(note, t, opacity) {
  const satellites = note.mesh.userData.spaceSatellites;
  if (!satellites) return;
  satellites.forEach((satellite, index) => {
    const axis = satellite.userData.axis;
    const base = perpendicularTo(axis, note.zone.judgeLineDirection);
    const angle = satellite.userData.phase + t * satellite.userData.speed;
    const orbitPosition = base
      .applyAxisAngle(axis, angle)
      .multiplyScalar(satellite.userData.radius);
    satellite.position.copy(orbitPosition);
    satellite.scale.setScalar(satellite.userData.baseScale * (0.88 + 0.12 * Math.sin(t * 3.2 + index)));
    satellite.material.opacity = opacity * satellite.userData.baseOpacity;
    satellite.visible = opacity > 0.025;
    satellite.userData.trails.forEach((trail) => {
      const trailStep = trail.userData.trailIndex;
      const trailAngle = angle - Math.sign(satellite.userData.speed) * trailStep * 0.18;
      const trailPosition = base.clone()
        .applyAxisAngle(axis, trailAngle)
        .multiplyScalar(satellite.userData.radius);
      const fade = Math.pow(1 - trailStep / (satellite.userData.trails.length + 1), 0.72);
      trail.position.copy(trailPosition);
      trail.scale.setScalar(satellite.userData.baseScale * (0.62 + fade * 0.58));
      trail.material.opacity = opacity * satellite.userData.baseOpacity * (0.22 + fade * 0.78);
      trail.visible = opacity > 0.025;
    });
  });
}

function updateHoldNoteVisual(note, segment, opacity, t, chartTime) {
  const { head, bodyParticles } = note.mesh.userData;
  const start = segment.head.position;
  const end = segment.tail.position;
  const holdTrajectory = note.holdTrajectory;
  const trajectoryStartTime = segment.trajectoryStartTime ?? holdTrajectory?.startTime ?? note.hitTime;
  const trajectoryEndTime = holdTrajectory?.endTime ?? note.endTime;
  const remainingTrajectoryTime = trajectoryEndTime - trajectoryStartTime;
  holdRenderDelta.copy(end).sub(start);
  const straightLength = Math.max(0.001, holdRenderDelta.length());
  holdRenderDirection.copy(holdRenderDelta).normalize();
  const radius = 0.25 * note.mesh.userData.holdRadiusScale;
  let straightAxisA;
  let straightAxisB;
  if (!holdTrajectory) {
    straightAxisA = holdRenderAxisA.copy(note.zone.judgeLineDirection)
      .addScaledVector(
        holdRenderDirection,
        -note.zone.judgeLineDirection.dot(holdRenderDirection)
      );
    if (straightAxisA.lengthSq() < 0.000001) straightAxisA.copy(note.zone.depthDirection);
    straightAxisA.normalize();
    straightAxisB = holdRenderAxisB.crossVectors(holdRenderDirection, straightAxisA).normalize();
  }

  note.mesh.position.set(0, 0, 0);
  note.mesh.quaternion.identity();
  head.position.copy(start);

  bodyParticles.forEach((particle, index) => {
    if (opacity <= 0.02 || (holdTrajectory ? remainingTrajectoryTime <= 0.002 : straightLength <= 0.05)) {
      particle.visible = false;
      return;
    }
    let u;
    let pathTime = null;
    if (holdTrajectory) {
      pathTime = particle.userData.pathTime;
      if (
        pathTime === null
        || pathTime < trajectoryStartTime
        || pathTime > trajectoryEndTime
      ) {
        particle.visible = false;
        return;
      }
      u = THREE.MathUtils.clamp(
        (pathTime - trajectoryStartTime) / Math.max(0.000001, remainingTrajectoryTime),
        0,
        1
      );
    } else {
      const activeParticleCount = Math.min(
        bodyParticles.length,
        Math.max(1, Math.ceil(straightLength * renderConfig.holdParticlesPerUnit))
      );
      if (index >= activeParticleCount) {
        particle.visible = false;
        return;
      }
      u = (index + 0.5) / activeParticleCount;
    }
    const radial = particle.userData.radial * radius;
    const angle = particle.userData.angle + t * particle.userData.orbitSpeed;
    const edgeFade = smoothstep(0.0, 0.08, u) * (1 - smoothstep(0.92, 1.0, u));
    const localOpacity = opacity * particle.userData.baseOpacity * edgeFade;
    const position = holdRenderPosition;
    let axisA;
    let axisB;
    if (holdTrajectory) {
      const pose = chartState.receiverTrajectory.sample(pathTime);
      pointFromReceiverPose(pose, note.localX, note.depthOffset, position);
      axisA = holdRenderAxisA.set(1, 0, 0).applyQuaternion(pose.quaternion).normalize();
      axisB = holdRenderAxisB.set(0, 0, 1).applyQuaternion(pose.quaternion).normalize();
    } else {
      axisA = straightAxisA;
      axisB = straightAxisB;
      position.copy(start).lerp(end, u);
    }
    position
      .addScaledVector(axisA, Math.cos(angle) * radial)
      .addScaledVector(axisB, Math.sin(angle) * radial);

    particle.position.copy(position);
    particle.quaternion.copy(camera.quaternion);
    particle.rotateZ(angle + particle.userData.spin);
    particle.scale.setScalar(particle.userData.scale);
    particle.material.opacity = localOpacity;
    particle.visible = localOpacity > 0.02;
  });

  const hitFlash = head.userData.hitFlash ?? 0;
  const headOpacity = opacity * capturedNoteVisibility(note, chartTime);
  updateSphereNoteVisual(head, headOpacity, head.userData.baseScale, hitFlash);
  head.userData.hitFlash = Math.max(0, hitFlash - 0.08);
  if (isSpaceNote(note)) {
    updateSpaceSatellites({ ...note, mesh: head }, t, headOpacity);
  }
  note.mesh.visible = opacity > 0.02;
}

function updateNotes(t, chartTime) {
  const visibleNotes = [];
  notes.forEach((note) => {
    if (isHoldNote(note)) {
      const segment = holdSegment(note, chartTime);
      const opacity = note.mesh.userData.baseOpacity
        * holdVisibility(segment.head.progress, segment.tail.timeToHit)
        * holdStateOpacity(note);
      updateHoldNoteVisual(note, segment, opacity, t, chartTime);
      if (opacity > 0.02) {
        visibleNotes.push({
          note,
          progress: segment.progress,
          timeToHit: segment.timeToHit,
          opacity,
          visibility: opacity,
          connectionPosition: segment.head.position.clone(),
          wPos: note.wPos
        });
      }
      return;
    }

    const { position, progress, timeToHit } = notePosition(note, chartTime);
    note.mesh.position.copy(position);
    if (!isPlayableNote(note)) note.mesh.quaternion.copy(note.zone.noteQuaternion);
    const isPlayable = isPlayableNote(note);
    const pulseScale = isPlayable ? Math.sin(t * 5 + note.pulse) * 0.035 : 0;
    const scale = note.mesh.userData.baseScale * (1 + pulseScale);
    const visibility = noteVisibility(progress, timeToHit) * capturedNoteVisibility(note, chartTime);
    const hitFlash = isPlayable ? (note.mesh.userData.hitFlash ?? 0) : 0;
    const opacity = note.mesh.userData.baseOpacity * visibility * (1 + hitFlash * 0.45);

    updateSphereNoteVisual(note.mesh, opacity, scale, hitFlash);
    if (isSpaceNote(note)) updateSpaceSatellites(note, t, opacity);
    note.mesh.userData.hitFlash = isPlayable ? Math.max(0, hitFlash - 0.08) : 0;
    if (opacity > 0.02) {
      visibleNotes.push({
        note,
        progress,
        timeToHit,
        opacity,
        visibility,
        connectionPosition: position.clone(),
        wPos: note.wPos
      });
    }
  });
  return visibleNotes;
}

function updateLandingHints(visibleNotes) {
  landingHintPool.forEach((hint) => {
    hint.visible = false;
  });

  let hintIndex = 0;
  const hintWindow = 1;
  const baseOpacity = chartState.motionMode === "receiver-catch" ? 0.28 : 0.08;
  const hitOpacity = chartState.motionMode === "receiver-catch" ? 0.28 : 0.22;
  const baseScale = chartState.motionMode === "receiver-catch" ? 1.0 : 0.75;
  const hitScale = chartState.motionMode === "receiver-catch" ? 0.42 : 0.65;
  visibleNotes.forEach((item) => {
    if (!isPlayableNote(item.note)) return;
    if (item.opacity <= 0.025) return;
    const timeToHit = item.timeToHit;
    if (timeToHit < -0.04 || timeToHit > hintWindow || hintIndex >= landingHintPool.length) return;

    const targetInfo = getLandingHintTransform(item.note);
    const normalizedLead = THREE.MathUtils.clamp(1 - timeToHit / hintWindow, 0, 1);
    const nearHit = smoothstep(0.0, 1.0, normalizedLead);
    const hint = landingHintPool[hintIndex];
    hint.position.copy(targetInfo.position);
    hint.quaternion.copy(targetInfo.quaternion);
    hint.material.color.copy(noteColor(item.note));
    hint.scale.setScalar(baseScale + nearHit * hitScale);
    const hintOpacity = chartState.motionMode === "receiver-catch"
      ? baseOpacity + nearHit * hitOpacity
      : item.opacity * (baseOpacity + nearHit * hitOpacity);
    hint.material.opacity = hintOpacity;
    hint.visible = true;
    hintIndex += 1;
  });
}

function writeConnectionGeometry(line, a, b, color, opacityScale, opacityOverride = null) {
  const start = a.connectionPosition ?? a.note.mesh.position;
  const end = b.connectionPosition ?? b.note.mesh.position;
  const delta = end.clone().sub(start);
  if (delta.length() <= 0.001) return false;

  const viewDirection = camera.position.clone().sub(start.clone().add(end).multiplyScalar(0.5)).normalize();
  const side = delta.clone().cross(viewDirection).normalize().multiplyScalar(renderConfig.multiHitLineWidth * 0.5);
  const positions = [];
  const colors = [];
  const alphas = [];
  const indices = [];
  const segmentCount = 1;

  for (let i = 0; i <= segmentCount; i += 1) {
    const u = i / segmentCount;
    const point = start.clone().lerp(end, u);
    const alpha = (opacityOverride ?? THREE.MathUtils.lerp(a.opacity, b.opacity, u)) * opacityScale;
    positions.push(
      point.x + side.x, point.y + side.y, point.z + side.z,
      point.x - side.x, point.y - side.y, point.z - side.z
    );
    colors.push(color.r, color.g, color.b, color.r, color.g, color.b);
    alphas.push(alpha, alpha);
  }

  for (let i = 0; i < segmentCount; i += 1) {
    const base = i * 2;
    indices.push(base, base + 1, base + 2, base + 1, base + 3, base + 2);
  }

  line.geometry.dispose();
  line.geometry = new THREE.BufferGeometry();
  line.geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  line.geometry.setAttribute("lineColor", new THREE.Float32BufferAttribute(colors, 3));
  line.geometry.setAttribute("lineAlpha", new THREE.Float32BufferAttribute(alphas, 1));
  line.geometry.setIndex(indices);
  line.visible = true;
  return true;
}

function connectionColor(a, b) {
  return noteColor(a.note).clone().lerp(noteColor(b.note), 0.5);
}

function updateNoteConnectionLines(visibleNotes) {
  linePool.forEach((line) => {
    line.visible = false;
  });

  let lineIndex = 0;
  const connect = (a, b, opacityScale, color = connectionColor(a, b), opacityOverride = null) => {
    if (lineIndex >= linePool.length) return;
    if (writeConnectionGeometry(linePool[lineIndex], a, b, color, opacityScale, opacityOverride)) {
      lineIndex += 1;
    }
  };

  const visibleItems = visibleNotes.filter((item) => item.opacity > 0.02);
  const visibleItemByNote = new Map(visibleItems.map((item) => [item.note, item]));
  chartState.constellationEdges.forEach((edge) => {
    const from = visibleItemByNote.get(edge.from);
    const to = visibleItemByNote.get(edge.to);
    if (!from || !to) return;
    connect(
      from,
      to,
      renderConfig.constellationLineOpacity,
      palette.white,
      Math.min(from.opacity, to.opacity)
    );
  });

  const hitGroups = new Map();
  visibleItems.forEach((item) => {
    const key = `${item.note.hitGroup}:${item.note.hitTime}`;
    if (!hitGroups.has(key)) hitGroups.set(key, []);
    hitGroups.get(key).push(item);
  });

  for (const group of hitGroups.values()) {
    const middleNotes = group
      .filter((item) => isMiddleNote(item.note))
      .sort((a, b) => (a.wPos ?? 0) - (b.wPos ?? 0));
    if (middleNotes.length === 0) continue;

    const leftmostMiddle = middleNotes[0];
    const rightmostMiddle = middleNotes[middleNotes.length - 1];
    const middleEdges = middleNotes.length === 1
      ? [leftmostMiddle]
      : [leftmostMiddle, rightmostMiddle];

    group.filter((item) => isSpecialChordNote(item.note)).forEach((specialNote) => {
      middleEdges.forEach((edgeNote) => {
        connect(specialNote, edgeNote, renderConfig.multiHitLineOpacity);
      });
    });
    group.filter((item) => item.note.type === "left").forEach((leftNote) => {
      connect(leftNote, leftmostMiddle, renderConfig.multiHitLineOpacity);
    });
    group.filter((item) => item.note.type === "right").forEach((rightNote) => {
      connect(rightNote, rightmostMiddle, renderConfig.multiHitLineOpacity);
    });
  }
}

function updateReceiver(t, beat) {
  receiverRing.scale.setScalar(1 + beat * 0.018);
  const pulsePhase = 0.5 + 0.5 * Math.sin(t * sideRailVisual.pulseSpeed);
  const railPulse = sideRailVisual.minPulse + (1 - sideRailVisual.minPulse) * pulsePhase;
  leftRail.material.opacity = leftRail.userData.baseOpacity * railPulse;
  rightRail.material.opacity = rightRail.userData.baseOpacity * railPulse;
  receiverGroup.position.copy(receiverState.anchor);
  receiverGroup.quaternion.copy(receiverState.currentQuaternion);
  receiverGroup.updateMatrixWorld(true);
  receiverGroup.getWorldQuaternion(receiverWorldQuaternion);
  receiverBillboardQuaternion.copy(receiverWorldQuaternion).invert().multiply(camera.quaternion);
  receiverSquareParticles.forEach((square, index) => {
    const phase = (square.userData.ySeed + t * square.userData.speed) % 1;
    const rise = phase * 2.45;
    const angle = square.userData.angle
      + t * square.userData.orbitSpeed
      + Math.sin(t * 0.16 + index) * 0.025;
    const radial = square.userData.radius + square.userData.radialDrift * phase;
    const tangent = square.userData.tangentDrift * phase;
    const radialX = Math.cos(angle);
    const radialZ = Math.sin(angle);
    const tangentX = -radialZ;
    const tangentZ = radialX;
    square.position.set(
      radialX * radial + tangentX * tangent,
      0.2 + rise,
      radialZ * radial + tangentZ * tangent
    );
    square.quaternion.copy(receiverBillboardQuaternion);
    square.rotateZ(t * (0.18 + (index % 4) * 0.07) + index);
    square.material.opacity = square.userData.baseOpacity
      * (1 - smoothstep(0.66, 1.0, phase))
      * smoothstep(0.0, 0.14, phase);
  });
}

function updateReceiverAnchor() {
  const state = sampleReceiverPose(chartState.chartTime);
  receiverState.currentPosition.copy(state.position);
  receiverState.currentQuaternion.copy(state.quaternion);
  receiverState.anchor.copy(receiverState.currentPosition);
}

function animate() {
  if (editorPreviewMode && !editorPreviewActive) {
    requestAnimationFrame(animate);
    return;
  }
  const t = clock.getElapsedTime();
  const beat = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 * 1.2);
  const slowBeat = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 * 0.4);

  if (t > gameplayState.feedbackUntil && logicStateReadout.textContent !== "on") {
    logicStateReadout.textContent = "on";
  }

  chartState.chartTime = getLiveChartTime();
  songProgressFill.style.width = `${THREE.MathUtils.clamp(chartState.chartTime / Math.max(timingConfig.chartDuration, 0.001), 0, 1) * 100}%`;
  if (!editorPreviewMode) advanceGameplay(chartState.chartTime);
  updateReceiverAnchor();
  updateSideTrajectories(chartState.chartTime);
  const visibleNotes = updateNotes(t, chartState.chartTime);
  updateLandingHints(visibleNotes);
  updateNoteConnectionLines(visibleNotes);

  if (debugFreeCamera) {
    controls.update();
  } else {
    const cameraOffset = currentCameraOffset();
    const target = applyCameraProfile(t, slowBeat, receiverState.anchor, receiverState.currentQuaternion, cameraOffset);
    controls.target.copy(target);
  }
  updateCameraDebug();
  updateReceiver(t, beat);
  updateHitEffects(t);
  updateBackgroundParticles(t);

  composer.render();
  requestAnimationFrame(animate);
}

animate();
</script>
