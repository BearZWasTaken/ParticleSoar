<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

const canvas = document.getElementById("scene");
const cameraModeReadout = document.getElementById("camera-mode");
const cameraPositionReadout = document.getElementById("camera-position");
const cameraTargetReadout = document.getElementById("camera-target");
const cameraFovReadout = document.getElementById("camera-fov");
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04070d);
scene.fog = new THREE.FogExp2(0x050914, 0.035);

const cameraProfile = {
  fov: 44,
  near: 0.1,
  far: 140,
  position: new THREE.Vector3(0, 0, 42),
  lookAt: new THREE.Vector3(0, 0, 0),
  swayX: 0,
  bobY: 0
};

const camera = new THREE.PerspectiveCamera(
  cameraProfile.fov,
  window.innerWidth / window.innerHeight,
  cameraProfile.near,
  cameraProfile.far
);

const cameraMount = {
  configured: false,
  referenceReceiverPosition: new THREE.Vector3(0, -10, 0),
  initialReceiverQuaternion: new THREE.Quaternion(),
  inverseInitialReceiverQuaternion: new THREE.Quaternion()
};

function applyCameraProfile(
  t = 0,
  bob = 0,
  anchor = new THREE.Vector3(),
  orientation = new THREE.Quaternion(),
  offset = {}
) {
  camera.fov = cameraProfile.fov;
  camera.near = cameraProfile.near;
  camera.far = cameraProfile.far;
  if (offset.fov) camera.fov += offset.fov;

  const localPosition = cameraProfile.position.clone().add(new THREE.Vector3(
    (offset.x ?? 0) + Math.sin(t * 0.16) * cameraProfile.swayX,
    (offset.y ?? 0) + bob * cameraProfile.bobY,
    offset.z ?? 0
  ));
  const localTarget = cameraProfile.lookAt.clone().add(new THREE.Vector3(
    offset.targetX ?? 0,
    offset.targetY ?? 0,
    offset.targetZ ?? 0
  ));
  const followPosition = cameraMount.configured
    ? localPosition
      .sub(cameraMount.referenceReceiverPosition)
      .applyQuaternion(cameraMount.inverseInitialReceiverQuaternion)
    : localPosition;
  const followTarget = cameraMount.configured
    ? localTarget
      .sub(cameraMount.referenceReceiverPosition)
      .applyQuaternion(cameraMount.inverseInitialReceiverQuaternion)
    : localTarget;
  const worldPosition = anchor.clone().add(followPosition.applyQuaternion(orientation));
  const worldTarget = anchor.clone().add(followTarget.applyQuaternion(orientation));

  camera.position.copy(worldPosition);
  camera.lookAt(worldTarget);
  camera.updateProjectionMatrix();
  return worldTarget;
}

applyCameraProfile();

let debugFreeCamera = true;
const controls = new OrbitControls(camera, renderer.domElement);
controls.enabled = debugFreeCamera;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.target.copy(cameraProfile.lookAt);
controls.minDistance = 2;
controls.maxDistance = 90;
controls.update();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.78,
  0.94,
  0.012
);
composer.addPass(bloom);

const notesRoot = new THREE.Group();
const particlesRoot = new THREE.Group();
scene.add(notesRoot, particlesRoot);

const axesHelper = new THREE.AxesHelper(8);
scene.add(axesHelper);

function makeAxisLabel(text, color) {
  const labelCanvas = document.createElement("canvas");
  labelCanvas.width = 128;
  labelCanvas.height = 128;
  const ctx = labelCanvas.getContext("2d");
  ctx.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
  ctx.font = "600 72px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 16;
  ctx.fillText(text, 64, 64);
  const texture = new THREE.CanvasTexture(labelCanvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthWrite: false
  }));
  sprite.scale.setScalar(0.9);
  scene.add(sprite);
  return sprite;
}

makeAxisLabel("X", "#ff4b4b").position.set(8.7, 0, 0);
makeAxisLabel("Y", "#52ff68").position.set(0, 8.7, 0);
makeAxisLabel("Z", "#4f8cff").position.set(0, 0, 8.7);

const palette = {
  white: new THREE.Color(0xeaf7ff),
  space: new THREE.Color(0xffd66b),
  left: new THREE.Color(0x70dcff),
  right: new THREE.Color(0xff70aa)
};

function makeGlowMaterial(color, opacity = 1) {
  return new THREE.MeshBasicMaterial({
    color,
    transparent: opacity < 1,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  });
}

function makeHotGlowMaterial(color, opacity = 1, intensity = 1) {
  const material = makeGlowMaterial(color, opacity);
  material.color.multiplyScalar(intensity);
  return material;
}

function makeGradientLineMaterial() {
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    vertexShader: `
      attribute vec3 lineColor;
      attribute float lineAlpha;
      varying vec3 vLineColor;
      varying float vLineAlpha;

      void main() {
        vLineColor = lineColor;
        vLineAlpha = lineAlpha;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vLineColor;
      varying float vLineAlpha;

      void main() {
        gl_FragColor = vec4(vLineColor, vLineAlpha);
      }
    `
  });
}

const matMiddle = makeHotGlowMaterial(palette.white, 0.99, 2.18);
const matSpace = makeHotGlowMaterial(palette.space, 0.99, 2.18);

const particleCount = 850;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
const particleSizes = new Float32Array(particleCount);
for (let i = 0; i < particleCount; i += 1) {
  const r = 5 + Math.random() * 32;
  const a = Math.random() * Math.PI * 2;
  particlePositions[i * 3] = Math.cos(a) * r;
  particlePositions[i * 3 + 1] = -2 + Math.random() * 17;
  particlePositions[i * 3 + 2] = Math.sin(a) * r - 5;
  particleSizes[i] = 0.5 + Math.random();
}
particleGeo.setAttribute("position", new THREE.BufferAttribute(particlePositions, 3));
particleGeo.setAttribute("size", new THREE.BufferAttribute(particleSizes, 1));
const particles = new THREE.Points(
  particleGeo,
  new THREE.PointsMaterial({
    color: 0xb9e8ff,
    size: 0.045,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
particlesRoot.add(particles);

const sphereGeo = new THREE.SphereGeometry(0.25, 32, 18);
const noteHaloGeo = new THREE.SphereGeometry(0.25, 32, 18);
const holdTriangleGeo = makeHoldTriangleGeometry();
const middleHaloScale = 1.62;
const notes = [];
const linePool = [];
const landingHintPool = [];

const timingConfig = {
  chartDuration: 8.4,
  flowSpeed: 11.75,
  postHitSeconds: 0.38,
  receiverMoveSeconds: 0.28
};

const playfieldConfig = {
  noteStartY: 20.0,
  noteHitY: -10.0,
  receiverRadius: 5.65,
  zSpread: 0.82,
  zoneStepX: 8.8
};

const renderConfig = {
  pooledConnections: 72,
  pooledLandingHints: 72,
  receiverParticles: 46,
  multiHitLineWidth: 0.063
};

const chartState = {
  chart: null,
  startTime: 0,
  chartTime: 0,
  flowSpeedTimeline: null,
  cameraTimelines: {},
  receiverEvents: [],
  receiverTransitions: []
};

const receiverState = {
  anchor: new THREE.Vector3(0, playfieldConfig.noteHitY, 0),
  currentPosition: new THREE.Vector3(0, playfieldConfig.noteHitY, 0),
  targetPosition: new THREE.Vector3(0, playfieldConfig.noteHitY, 0),
  currentQuaternion: new THREE.Quaternion(),
  targetQuaternion: new THREE.Quaternion(),
  currentZone: null,
  targetZone: null,
  moving: false,
  progress: 0
};

const clock = new THREE.Clock();

function getTargetForNote(note) {
  return {
    position: note.hitPosition.clone()
  };
}

function laneX(lane, phase) {
  return -4.2 + ((lane * 1.68 + phase * 9.6) % 8.4);
}

function defaultZOffset(seed) {
  return Math.sin(seed * 37.0) * playfieldConfig.zSpread;
}

function normalizeVector(value, fallback) {
  const vector = toVector3(value, fallback);
  return vector.lengthSq() > 0.000001 ? vector.normalize() : fallback.clone().normalize();
}

function directionFromAngles(azimuth = 0, elevation = 0) {
  const horizontal = Math.cos(elevation);
  return new THREE.Vector3(
    Math.cos(azimuth) * horizontal,
    Math.sin(elevation),
    Math.sin(azimuth) * horizontal
  ).normalize();
}

function perpendicularTo(axis, preferred = new THREE.Vector3(0, -1, 0)) {
  let projected = preferred.clone().sub(axis.clone().multiplyScalar(preferred.dot(axis)));
  if (projected.lengthSq() < 0.000001) {
    projected = new THREE.Vector3(1, 0, 0).sub(axis.clone().multiplyScalar(axis.x));
  }
  if (projected.lengthSq() < 0.000001) {
    projected = new THREE.Vector3(0, 0, 1).sub(axis.clone().multiplyScalar(axis.z));
  }
  return projected.normalize();
}

function fallDirectionFromAngle(judgeLineDirection, fallAngle = 0) {
  return perpendicularTo(judgeLineDirection).applyAxisAngle(judgeLineDirection, fallAngle).normalize();
}

function quaternionFromXY(xAxis, yAxis) {
  const x = xAxis.clone().normalize();
  const y = yAxis.clone().normalize();
  const z = new THREE.Vector3().crossVectors(x, y).normalize();
  const correctedY = new THREE.Vector3().crossVectors(z, x).normalize();
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, correctedY, z));
}

function createDropZone(raw = {}, fallback = {}) {
  const receiverPosition = toVector3(
    raw.receiverPosition ?? raw.position ?? raw.zonePosition,
    fallback.receiverPosition ?? new THREE.Vector3(0, playfieldConfig.noteHitY, 0)
  );
  const judgeLineDirection = raw.judgeLineDirection
    ? normalizeVector(raw.judgeLineDirection, fallback.judgeLineDirection ?? new THREE.Vector3(1, 0, 0))
    : raw.judgeLineAngles
      ? directionFromAngles(raw.judgeLineAngles[0] ?? 0, raw.judgeLineAngles[1] ?? 0)
      : raw.judgeLineAzimuth !== undefined || raw.judgeLineElevation !== undefined
        ? directionFromAngles(raw.judgeLineAzimuth ?? 0, raw.judgeLineElevation ?? 0)
        : normalizeVector(fallback.judgeLineDirection, new THREE.Vector3(1, 0, 0));
  let fallDirection = raw.fallDirection
    ? normalizeVector(raw.fallDirection, fallback.fallDirection ?? new THREE.Vector3(0, -1, 0))
    : fallback.fallDirection && raw.fallAngle === undefined
      ? normalizeVector(fallback.fallDirection, new THREE.Vector3(0, -1, 0))
      : fallDirectionFromAngle(judgeLineDirection, raw.fallAngle ?? fallback.fallAngle ?? 0);
  fallDirection = fallDirection
    .sub(judgeLineDirection.clone().multiplyScalar(fallDirection.dot(judgeLineDirection)))
    .normalize();
  if (fallDirection.lengthSq() < 0.000001) fallDirection.copy(perpendicularTo(judgeLineDirection));
  const depthDirection = new THREE.Vector3().crossVectors(judgeLineDirection, fallDirection).normalize();
  const receiverQuaternion = quaternionFromXY(judgeLineDirection, fallDirection.clone().negate());
  const noteQuaternion = quaternionFromXY(judgeLineDirection, fallDirection.clone().negate());

  return {
    receiverPosition,
    judgeLineDirection,
    fallDirection,
    depthDirection,
    receiverQuaternion,
    noteQuaternion,
    travelDistance: raw.travelDistance ?? fallback.travelDistance ?? Math.abs(playfieldConfig.noteStartY - playfieldConfig.noteHitY)
  };
}

function localPointInZone(zone, localX = 0, depthOffset = 0) {
  return zone.receiverPosition.clone()
    .add(zone.judgeLineDirection.clone().multiplyScalar(localX))
    .add(zone.depthDirection.clone().multiplyScalar(depthOffset));
}

function normalizeTimeline(events = [], defaultValue = 0) {
  return {
    defaultValue,
    events: [...events].sort((a, b) => a.startTime - b.startTime || a.endTime - b.endTime)
  };
}

function curveValue(event, localTime) {
  const duration = Math.max(0.0001, event.endTime - event.startTime);
  const raw = THREE.MathUtils.clamp(localTime / duration, 0, 1);
  const curve = event.curve ?? "linear";
  const u = curve === "easeInCubic"
    ? raw * raw * raw
    : curve === "smoothstep"
      ? raw * raw * (3 - 2 * raw)
      : raw;
  const from = event.from ?? event.value ?? 0;
  const to = event.to ?? event.value ?? from;
  return THREE.MathUtils.lerp(from, to, u);
}

function evaluateTimeline(timeline, chartTime) {
  if (!timeline) return 0;
  let previous = null;
  let next = null;
  for (const event of timeline.events) {
    if (event.startTime <= chartTime && chartTime < event.endTime) {
      return curveValue(event, chartTime - event.startTime);
    }
    if (event.startTime <= chartTime) previous = event;
    if (event.startTime > chartTime) {
      next = event;
      break;
    }
  }
  if (previous) return curveValue(previous, previous.endTime - previous.startTime);
  if (next) return curveValue(next, 0);
  return timeline.defaultValue;
}

function currentFlowSpeed() {
  return Math.max(0.001, evaluateTimeline(chartState.flowSpeedTimeline, chartState.chartTime));
}

function currentCameraOffset() {
  return {
    x: evaluateTimeline(chartState.cameraTimelines.x, chartState.chartTime),
    y: evaluateTimeline(chartState.cameraTimelines.y, chartState.chartTime),
    z: evaluateTimeline(chartState.cameraTimelines.z, chartState.chartTime),
    targetX: evaluateTimeline(chartState.cameraTimelines.targetX, chartState.chartTime),
    targetY: evaluateTimeline(chartState.cameraTimelines.targetY, chartState.chartTime),
    targetZ: evaluateTimeline(chartState.cameraTimelines.targetZ, chartState.chartTime),
    fov: evaluateTimeline(chartState.cameraTimelines.fov, chartState.chartTime)
  };
}

function zoneFromReceiverEvent(event, fallbackZone) {
  const receiverPosition = toVector3(
    event.receiverPosition ?? event.position ?? event.targetPosition ?? event.target,
    fallbackZone.receiverPosition
  );
  if (event.x !== undefined || event.y !== undefined || event.z !== undefined) {
    receiverPosition.set(
      event.x ?? receiverPosition.x,
      event.y ?? receiverPosition.y,
      event.z ?? receiverPosition.z
    );
  }
  return createDropZone({ ...event, receiverPosition }, fallbackZone);
}

function buildReceiverTimeline(rawEvents = []) {
  const sortedEvents = [...rawEvents].sort((a, b) => a.hitTime - b.hitTime);
  const events = [];
  const transitions = [];
  let previousZone = createDropZone();

  if (sortedEvents.length === 0 || sortedEvents[0].hitTime > 0) {
    events.push({
      hitTime: 0,
      zone: previousZone,
      raw: { hitTime: 0 }
    });
  }

  sortedEvents.forEach((event) => {
    const zone = zoneFromReceiverEvent(event, previousZone);
    events.push({
      hitTime: event.hitTime ?? 0,
      zone,
      raw: event
    });
    previousZone = zone;
  });

  for (let i = 1; i < events.length; i += 1) {
    const event = events[i];
    const duration = Math.max(0, event.raw.moveSeconds ?? event.raw.duration ?? timingConfig.receiverMoveSeconds);
    transitions.push({
      startTime: event.hitTime,
      endTime: event.hitTime + duration,
      fromZone: events[i - 1].zone,
      toZone: event.zone,
      curve: event.raw.curve ?? "smoothstep"
    });
  }

  return { events, transitions };
}

function transitionProgress(transition, chartTime) {
  const duration = Math.max(0.0001, transition.endTime - transition.startTime);
  const raw = THREE.MathUtils.clamp((chartTime - transition.startTime) / duration, 0, 1);
  if (transition.curve === "linear") return raw;
  if (transition.curve === "easeInCubic") return raw * raw * raw;
  if (transition.curve === "easeOutCubic") return 1 - Math.pow(1 - raw, 3);
  return raw * raw * (3 - 2 * raw);
}

function interpolateReceiverZones(fromZone, toZone, progress) {
  const position = fromZone.receiverPosition.clone().lerp(toZone.receiverPosition, progress);
  const quaternion = fromZone.receiverQuaternion.clone().slerp(toZone.receiverQuaternion, progress);
  return {
    zone: progress < 1 ? fromZone : toZone,
    targetZone: toZone,
    position,
    quaternion,
    moving: progress > 0 && progress < 1,
    progress
  };
}

function receiverStateAt(chartTime) {
  const events = chartState.receiverEvents;
  if (events.length === 0) {
    const zone = createDropZone();
    return {
      zone,
      targetZone: zone,
      position: zone.receiverPosition.clone(),
      quaternion: zone.receiverQuaternion.clone(),
      moving: false,
      progress: 0
    };
  }

  for (const transition of chartState.receiverTransitions) {
    if (transition.startTime <= chartTime && chartTime < transition.endTime) {
      return interpolateReceiverZones(
        transition.fromZone,
        transition.toZone,
        transitionProgress(transition, chartTime)
      );
    }
  }

  let activeEvent = events[0];
  for (const event of events) {
    if (event.hitTime > chartTime) break;
    activeEvent = event;
  }
  return {
    zone: activeEvent.zone,
    targetZone: activeEvent.zone,
    position: activeEvent.zone.receiverPosition.clone(),
    quaternion: activeEvent.zone.receiverQuaternion.clone(),
    moving: false,
    progress: 1
  };
}

function createNoteMesh(kind = "middle") {
  const isSpace = kind === "space";
  const mesh = new THREE.Mesh(sphereGeo, (isSpace ? matSpace : matMiddle).clone());
  const halo = new THREE.Mesh(
    noteHaloGeo,
    makeHotGlowMaterial(isSpace ? palette.space : 0xffffff, 0.56, 1.9)
  );
  halo.userData.baseOpacity = 0.56;
  halo.scale.setScalar(middleHaloScale);
  mesh.add(halo);
  mesh.userData.halo = halo;
  if (isSpace) {
    const satellites = Array.from({ length: 4 }, (_, index) => {
      const satellite = new THREE.Mesh(
        sphereGeo,
        makeHotGlowMaterial(palette.space, 0.82, 2.05)
      );
      const axis = normalizeVector({
        x: Math.sin(index * 1.71),
        y: Math.cos(index * 2.23),
        z: Math.sin(index * 2.91 + 0.7)
      }, new THREE.Vector3(0, 1, 0));
      satellite.userData = {
        axis,
        radius: 0.7 + (index % 5) * 0.05,
        phase: index * 0.74,
        speed: (index % 2 === 0 ? 1 : -1) * (1.75 + (index % 5) * 0.22),
        baseOpacity: 0.72,
        baseScale: 0.26 + (index % 3) * 0.035,
        trails: Array.from({ length: 12 }, (_, trailIndex) => {
          const trail = new THREE.Mesh(
            sphereGeo,
            makeHotGlowMaterial(palette.space, 0.74, 2.18)
          );
          trail.material.depthTest = false;
          trail.renderOrder = 8;
          trail.userData.trailIndex = trailIndex + 1;
          mesh.add(trail);
          return trail;
        })
      };
      mesh.add(satellite);
      return satellite;
    });
    mesh.userData.spaceSatellites = satellites;
  }
  mesh.userData.baseScale = 1.248;
  mesh.userData.baseOpacity = 1;
  notesRoot.add(mesh);
  return mesh;
}

function makeHoldTriangleGeometry() {
  const shape = new THREE.Shape([
    new THREE.Vector2(0, 0.62),
    new THREE.Vector2(-0.54, -0.36),
    new THREE.Vector2(0.54, -0.36)
  ]);
  return new THREE.ShapeGeometry(shape);
}

function createHoldNoteMesh(kind = "middle") {
  const color = kind === "space" ? palette.space : palette.white;
  const group = new THREE.Group();
  const head = createNoteMesh(kind);
  const bodyParticles = Array.from({ length: 120 }, (_, index) => {
    const triangle = new THREE.Mesh(
      holdTriangleGeo,
      makeHotGlowMaterial(color, 0.58, 1.88)
    );
    const radial = Math.sqrt(((index * 0.61803398875) % 1));
    const angle = ((index * 2.39996322973) + Math.sin(index * 5.17) * 0.45) % (Math.PI * 2);
    triangle.userData = {
      baseOpacity: 0.48 + (index % 4) * 0.055,
      radial,
      angle,
      along: (index * 0.754877666) % 1,
      scale: 0.22 + (index % 6) * 0.032,
      spin: (index % 2 === 0 ? 1 : -1) * (0.12 + (index % 9) * 0.019),
      orbitSpeed: 0.85 + (index % 11) * 0.055
    };
    return triangle;
  });
  notesRoot.remove(head);
  group.add(...bodyParticles, head);
  group.userData.bodyParticles = bodyParticles;
  group.userData.head = head;
  group.userData.holdRadiusScale = head.userData.baseScale * 1.8;
  group.userData.baseScale = 1;
  group.userData.baseOpacity = 1;
  notesRoot.add(group);
  return group;
}

function makeChevronGeometry(direction, width, height, thickness) {
  const sign = direction === "left" ? -1 : 1;
  const w = width * 0.5;
  const h = height * 0.5;
  const t = thickness;
  const points = [
    [-w, h],
    [w * 0.86, 0],
    [-w, -h],
    [-w + t, -h],
    [w * 0.86 - t * 1.55, 0],
    [-w + t, h]
  ].map(([x, y]) => new THREE.Vector2(x * sign, y));
  const shape = new THREE.Shape(points);
  return new THREE.ShapeGeometry(shape);
}

function createSideNoteMesh(direction) {
  const group = new THREE.Group();
  const color = direction === "left" ? palette.left : palette.right;
  const material = makeHotGlowMaterial(color, 0.98, 2.36);
  const glowMaterial = makeHotGlowMaterial(color, 0.76, 3.55);
  const chevronGeo = makeChevronGeometry(direction, 0.96, 0.96, 0.23);
  const chevronCount = 4;
  const step = playfieldConfig.receiverRadius * 0.28;
  const sideCenter = (direction === "left" ? -1 : 1) * playfieldConfig.receiverRadius * 0.46;

  for (let i = 0; i < chevronCount; i += 1) {
    const baseX = sideCenter + (i - (chevronCount - 1) / 2) * step;
    const glow = new THREE.Mesh(chevronGeo, glowMaterial.clone());
    const chevron = new THREE.Mesh(chevronGeo, material.clone());
    glow.position.set(baseX, 0, -0.01);
    chevron.position.set(baseX, 0, 0);
    glow.scale.setScalar(1.28);
    glow.userData.opacityScale = 1;
    chevron.userData.opacityScale = 1;
    group.add(glow, chevron);
  }

  group.userData.baseScale = 1;
  group.userData.baseOpacity = 1;
  notesRoot.add(group);
  return group;
}

function isHoldNote(noteOrType) {
  const type = typeof noteOrType === "string" ? noteOrType : noteOrType.type;
  return type === "hold" || type === "middleHold" || type === "spaceHold";
}

function isSpaceNote(noteOrType) {
  const type = typeof noteOrType === "string" ? noteOrType : noteOrType.type;
  return type === "space" || type === "spaceHold";
}

function holdKind(type) {
  return type === "spaceHold" ? "space" : "middle";
}

function isCentralNote(noteOrType) {
  const type = typeof noteOrType === "string" ? noteOrType : noteOrType.type;
  return type === "middle" || type === "space" || isHoldNote(type);
}

function spawnNote(rawNote, index = 0) {
  const hitTime = rawNote.hitTime ?? rawNote.time ?? 0;
  const endTime = rawNote.endTime ?? rawNote.releaseTime ?? (rawNote.duration !== undefined ? hitTime + rawNote.duration : hitTime);
  const phase = ((hitTime ?? 0) / timingConfig.chartDuration) % 1;
  const lane = rawNote.lane ?? 0;
  const type = rawNote.type ?? "middle";
  const localX = isCentralNote(type)
    ? (rawNote.localX ?? rawNote.x ?? laneX(lane, phase))
    : 0;
  const depthOffset = rawNote.depthOffset ?? rawNote.z ?? defaultZOffset(rawNote.zSeed ?? phase);
  const zone = createDropZone(rawNote.zone ?? rawNote, createDropZone());
  const hitPosition = toVector3(
    rawNote.hitPosition ?? rawNote.targetPosition,
    localPointInZone(zone, localX, depthOffset)
  );
  const travelDistance = rawNote.travelDistance
    ?? zone.travelDistance
    ?? Math.abs((rawNote.startY ?? playfieldConfig.noteStartY) - playfieldConfig.noteHitY);
  const startPosition = toVector3(
    rawNote.startPosition,
    hitPosition.clone().sub(zone.fallDirection.clone().multiplyScalar(travelDistance))
  );
  const receiverZone = createDropZone(rawNote.receiverZone ?? rawNote.targetZone ?? rawNote, zone);
  const mesh = isHoldNote(type)
    ? createHoldNoteMesh(holdKind(type))
    : isCentralNote(type)
      ? createNoteMesh(type)
      : createSideNoteMesh(type);
  if (!isCentralNote(type)) mesh.quaternion.copy(zone.noteQuaternion);
  notes.push({
    mesh,
    type,
    lane,
    hitTime,
    endTime,
    localX,
    wPos: rawNote.wPos ?? localX,
    depthOffset,
    zone,
    startPosition,
    hitPosition,
    receiverZone,
    hitGroup: rawNote.hitGroup ?? rawNote.group ?? `note-${index}`,
    pulse: Math.random() * 10,
    judged: false,
    hit: false
  });
}

function clearNotes() {
  notes.forEach((note) => {
    notesRoot.remove(note.mesh);
    note.mesh.traverse((object) => {
      object.material?.dispose?.();
    });
  });
  notes.length = 0;
}

function toVector3(value, fallback) {
  if (Array.isArray(value)) return new THREE.Vector3(value[0], value[1], value[2]);
  if (value && typeof value === "object") {
    return new THREE.Vector3(value.x ?? fallback.x, value.y ?? fallback.y, value.z ?? fallback.z);
  }
  return fallback.clone();
}

function applyChartSettings(chart) {
  if (chart.timing) Object.assign(timingConfig, chart.timing);
  if (chart.playfield) Object.assign(playfieldConfig, chart.playfield);
  chartState.flowSpeedTimeline = normalizeTimeline(
    chart.timelines?.FlowSpeed ?? chart.timelines?.flowSpeed ?? [],
    timingConfig.flowSpeed
  );
  chartState.cameraTimelines = {
    x: normalizeTimeline(chart.timelines?.CameraX ?? chart.timelines?.CamX ?? [], 0),
    y: normalizeTimeline(chart.timelines?.CameraY ?? chart.timelines?.CamY ?? [], 0),
    z: normalizeTimeline(chart.timelines?.CameraZ ?? chart.timelines?.CamZ ?? [], 0),
    targetX: normalizeTimeline(chart.timelines?.CameraTargetX ?? [], 0),
    targetY: normalizeTimeline(chart.timelines?.CameraTargetY ?? [], 0),
    targetZ: normalizeTimeline(chart.timelines?.CameraTargetZ ?? [], 0),
    fov: normalizeTimeline(chart.timelines?.CameraFov ?? [], 0)
  };
  const receiverTimeline = buildReceiverTimeline(chart.receiverEvents ?? []);
  chartState.receiverEvents = receiverTimeline.events;
  chartState.receiverTransitions = receiverTimeline.transitions;
  if (chart.camera) {
    const cameraSettings = chart.camera;
    cameraProfile.fov = cameraSettings.fov ?? cameraProfile.fov;
    cameraProfile.near = cameraSettings.near ?? cameraProfile.near;
    cameraProfile.far = cameraSettings.far ?? cameraProfile.far;
    cameraProfile.position.copy(toVector3(cameraSettings.position, cameraProfile.position));
    cameraProfile.lookAt.copy(toVector3(cameraSettings.target ?? cameraSettings.lookAt, cameraProfile.lookAt));
    applyCameraProfile();
    controls.target.copy(cameraProfile.lookAt);
    controls.update();
  }
}

function configureCameraMount() {
  cameraMount.configured = true;
  cameraMount.referenceReceiverPosition.set(0, playfieldConfig.noteHitY, 0);
  cameraMount.initialReceiverQuaternion.identity();
  cameraMount.inverseInitialReceiverQuaternion.identity();
}

function loadChart(chart) {
  chartState.chart = chart;
  chartState.startTime = clock?.getElapsedTime?.() ?? 0;
  chartState.chartTime = 0;
  cameraMount.configured = false;
  applyChartSettings(chart);
  const initialReceiverState = receiverStateAt(0);
  const initialZone = initialReceiverState.zone;
  configureCameraMount();
  receiverState.currentZone = initialZone;
  receiverState.targetZone = initialReceiverState.targetZone;
  receiverState.currentPosition.copy(initialReceiverState.position);
  receiverState.targetPosition.copy(initialReceiverState.targetZone.receiverPosition);
  receiverState.currentQuaternion.copy(initialReceiverState.quaternion);
  receiverState.targetQuaternion.copy(initialReceiverState.targetZone.receiverQuaternion);
  receiverState.moving = initialReceiverState.moving;
  receiverState.progress = initialReceiverState.progress;
  receiverState.anchor.copy(receiverState.currentPosition);
  syncPlayfieldVisuals();
  clearNotes();
  chart.notes.forEach((note, index) => spawnNote(note, index));
}

function createDemoChart() {
  const beatCount = 32;
  const duration = 11.2;
  const chartNotes = [];
  const receiverEvents = [];
  const prismCenter = new THREE.Vector3(0, playfieldConfig.noteHitY, 0);
  const prismApothem = 18.6;
  const fallDirection = new THREE.Vector3(0, -1, 0);

  const faceAt = (step) => {
    const normalAngle = -step * Math.PI / 4;
    const faceNormal = new THREE.Vector3(Math.cos(normalAngle), 0, Math.sin(normalAngle)).normalize();
    const judgeLineDirection = new THREE.Vector3().crossVectors(fallDirection, faceNormal).normalize();
    return {
      faceNormal,
      judgeLineDirection,
      fallDirection,
      receiverPosition: prismCenter.clone().add(faceNormal.clone().multiplyScalar(prismApothem))
    };
  };

  const zonePayload = (face) => ({
    receiverPosition: face.receiverPosition.toArray(),
    judgeLineDirection: face.judgeLineDirection.toArray(),
    fallDirection: face.fallDirection.toArray()
  });

  let currentFaceIndex = 0;
  let currentFace = faceAt(currentFaceIndex);
  receiverEvents.push({ hitTime: 0, ...zonePayload(currentFace) });

  const tripleHitTime = 1.05;
  const tripleGroup = "triple-hold-space-test";
  [
    { type: "hold", localX: -2.8, depthOffset: -0.18, endTime: tripleHitTime + 1.25 },
    { type: "spaceHold", localX: 0, depthOffset: 0.12, endTime: tripleHitTime + 1.05 },
    { type: "middle", localX: 2.8, depthOffset: 0.32 }
  ].forEach((note, lane) => {
    chartNotes.push({
      ...note,
      lane,
      hitTime: tripleHitTime,
      hitGroup: tripleGroup,
      wPos: note.localX,
      zone: zonePayload(currentFace)
    });
  });

  for (let i = 0; i < beatCount; i += 1) {
    const phrase = i % 4;
    const hitTime = 0.45 + (i / beatCount) * duration;
    const phase = hitTime / duration;
    const hitGroup = `g-${i}`;
    const add = (lane) => {
      const localX = laneX(lane, phase);
      const depthOffset = defaultZOffset(phase + lane * 0.07);
      const isHold = i % 8 === 5;
      const isSpaceHold = isHold && i % 16 === 13;
      const isSpace = !isHold && i % 6 === 4;
      chartNotes.push({
        type: isSpaceHold ? "spaceHold" : isHold ? "hold" : isSpace ? "space" : "middle",
        lane,
        localX,
        hitTime,
        ...(isHold ? { endTime: Math.min(hitTime + 0.9, duration - 0.15) } : {}),
        hitGroup,
        depthOffset,
        zone: zonePayload(currentFace)
      });
    };
    if (phrase === 0) {
      add((i + 1) % 6);
    } else if (phrase === 2) {
      add((i + 3) % 6);
    } else if (phrase === 1) {
      add(i % 6);
      add((i + 2) % 6);
    } else {
      add(i % 6);
    }

    if (phrase === 3) {
      const nextFace = faceAt(currentFaceIndex + 1);
      chartNotes.push({
        type: "left",
        hitTime,
        hitGroup: `side-${i}`,
        zone: zonePayload(currentFace),
        receiverZone: zonePayload(nextFace)
      });
      receiverEvents.push({ hitTime, ...zonePayload(nextFace) });
      currentFaceIndex += 1;
      currentFace = nextFace;
    }
  }
  return {
    meta: { title: "mock", format: "ParticleSoarChart/v0" },
    timing: { ...timingConfig, chartDuration: duration },
    playfield: { ...playfieldConfig },
    timelines: { FlowSpeed: [] },
    receiverEvents,
    notes: chartNotes
  };
}

function syncOctagonGuide() {
  const apothem = 18.6;
  const center = new THREE.Vector3(0, playfieldConfig.noteHitY - 0.02, 0);
  const radius = apothem / Math.cos(Math.PI / 8);
  const points = [];
  for (let i = 0; i < 8; i += 1) {
    const angle = -Math.PI / 2 + Math.PI / 8 + i * Math.PI / 4;
    points.push(
      center.x + Math.cos(angle) * radius,
      center.y,
      center.z + Math.sin(angle) * radius
    );
  }
  octagonGuide.geometry.dispose();
  octagonGuide.geometry = new THREE.BufferGeometry();
  octagonGuide.geometry.setAttribute("position", new THREE.Float32BufferAttribute(points, 3));
}

function makeEllipseTubeGeometry(radiusX, radiusY, tubeRadius) {
  const points = [];
  const segments = 192;
  for (let i = 0; i < segments; i += 1) {
    const a = (i / segments) * Math.PI * 2;
    points.push(new THREE.Vector3(Math.cos(a) * radiusX, 0, Math.sin(a) * radiusY));
  }
  const curve = new THREE.CatmullRomCurve3(points, true, "centripetal");
  return new THREE.TubeGeometry(curve, segments, tubeRadius, 8, true);
}

const leftKeyCodes = new Set([

  "Digit1", "Digit2", "Digit3",
  "KeyQ", "KeyW", "KeyE",
  "KeyA", "KeyS",

]);

  "Semicolon", "Quote", "Enter",
  "Period", "Slash", "ShiftRight",
  "Minus", "Equal", "Backspace"
]);

function judgeSideInput(direction) {
  const windowSeconds = 0.16;
  let best = null;
  let bestDelta = Infinity;
  notes.forEach((note) => {
    if (note.type !== direction || note.judged) return;
    const delta = Math.abs(timeUntilHit(note.hitTime, chartState.chartTime));
    if (delta < bestDelta) {
      best = note;
      bestDelta = delta;
    }
  });
  if (!best || bestDelta > windowSeconds) return;
  best.judged = true;
  best.hit = true;
}

window.addEventListener("keydown", (event) => {
  if (event.repeat) return;
  if (event.code === "Equal") {
    event.preventDefault();
    setFreeCamera(!debugFreeCamera);
    return;
  }
  if (leftKeyCodes.has(event.code)) judgeSideInput("left");
  if (rightKeyCodes.has(event.code)) judgeSideInput("right");
});

function easeInCubic(t) {
  return t * t * t;
}

function smoothstep(edge0, edge1, value) {
  const x = THREE.MathUtils.clamp((value - edge0) / (edge1 - edge0), 0, 1);
  return x * x * (3 - 2 * x);
}

function noteVisibility(progress) {
  const fadeIn = smoothstep(0.0, 0.12, progress);
  const fadeOut = 1 - smoothstep(1.005, 1.055, progress);
  return fadeIn * fadeOut;
}

function holdVisibility(headProgress, tailProgress) {
  const fadeIn = smoothstep(0.0, 0.12, headProgress);
  const fadeOut = 1 - smoothstep(1.005, 1.055, tailProgress);
  return fadeIn * fadeOut;
}

function noteTravelFactor(progress) {
  return progress <= 1
    ? easeInCubic(THREE.MathUtils.clamp(progress, 0, 1))
    : 1 + 3 * (progress - 1);
}

function timeUntilHit(hitTime, chartTime, wrap = true) {
  let dt = hitTime - chartTime;
  if (wrap && dt < -timingConfig.postHitSeconds) dt += timingConfig.chartDuration;
  return dt;
}

function notePointAtHitTime(note, hitTime, chartTime, wrap = true) {
  const timeToHit = timeUntilHit(hitTime, chartTime, wrap);
  const travelSeconds = note.startPosition.distanceTo(note.hitPosition) / currentFlowSpeed();
  const p = 1 - timeToHit / travelSeconds;
  const factor = noteTravelFactor(p);
  const x = THREE.MathUtils.lerp(note.startPosition.x, note.hitPosition.x, factor);
  const y = THREE.MathUtils.lerp(note.startPosition.y, note.hitPosition.y, factor);
  const z = THREE.MathUtils.lerp(note.startPosition.z, note.hitPosition.z, factor);
  return { position: new THREE.Vector3(x, y, z), progress: p, timeToHit };
}

function notePosition(note, chartTime) {
  return notePointAtHitTime(note, note.hitTime, chartTime);
}

function holdSegment(note, chartTime) {
  const head = notePointAtHitTime(note, note.hitTime, chartTime, false);
  const tail = notePointAtHitTime(note, note.endTime, chartTime, false);
  if (head.progress > 1) {
    head.position.copy(note.hitPosition);
  }
  return {
    head,
    tail,
    progress: head.progress,
    timeToHit: head.timeToHit
  };
}

function formatVector(v) {

function setObjectOpacity(object, opacity) {
  object.traverse((child) => {
    if (child.material) child.material.opacity = opacity * (child.userData.opacityScale ?? 1);
  });
}

function updateSphereNoteVisual(mesh, opacity, scale, hitFlash = 0) {
  const halo = mesh.userData.halo;
  mesh.scale.setScalar(scale * (1 + hitFlash * 0.16));
  setObjectOpacity(mesh, opacity);
  mesh.visible = true;
  if (halo) {
    halo.visible = opacity > 0.02;
    halo.material.opacity = opacity * halo.userData.baseOpacity;
    halo.scale.setScalar(middleHaloScale);
  }
}

function updateSpaceSatellites(note, t, opacity) {
  const satellites = note.mesh.userData.spaceSatellites;
  if (!satellites) return;
  satellites.forEach((satellite, index) => {
    const axis = satellite.userData.axis;
    const base = perpendicularTo(axis, note.zone.judgeLineDirection);
    const angle = satellite.userData.phase + t * satellite.userData.speed;
    const orbitPosition = base
      .applyAxisAngle(axis, angle)
      .multiplyScalar(satellite.userData.radius);
    satellite.position.copy(orbitPosition);
    satellite.scale.setScalar(satellite.userData.baseScale * (0.88 + 0.12 * Math.sin(t * 3.2 + index)));
    satellite.material.opacity = opacity * satellite.userData.baseOpacity;
    satellite.visible = opacity > 0.025;
    satellite.userData.trails.forEach((trail) => {
      const trailStep = trail.userData.trailIndex;
      const trailAngle = angle - Math.sign(satellite.userData.speed) * trailStep * 0.18;
      const trailPosition = base.clone()
        .applyAxisAngle(axis, trailAngle)
        .multiplyScalar(satellite.userData.radius);
      const fade = Math.pow(1 - trailStep / (satellite.userData.trails.length + 1), 0.72);
      trail.position.copy(trailPosition);
      trail.scale.setScalar(satellite.userData.baseScale * (0.62 + fade * 0.58));
      trail.material.opacity = opacity * satellite.userData.baseOpacity * (0.22 + fade * 0.78);
      trail.visible = opacity > 0.025;
    });
  });
}

function updateHoldNoteVisual(note, segment, opacity, t) {
  const { head, bodyParticles } = note.mesh.userData;
  const start = segment.head.position;
  const end = segment.tail.position;
  const delta = end.clone().sub(start);
  const length = Math.max(0.001, delta.length());
  const direction = delta.normalize();
  const radius = 0.25 * note.mesh.userData.holdRadiusScale;
  const axisA = note.zone.judgeLineDirection.clone().sub(direction.clone().multiplyScalar(note.zone.judgeLineDirection.dot(direction)));
  if (axisA.lengthSq() < 0.000001) axisA.copy(note.zone.depthDirection);
  axisA.normalize();
  const axisB = new THREE.Vector3().crossVectors(direction, axisA).normalize();

  note.mesh.position.set(0, 0, 0);
  note.mesh.quaternion.identity();
  head.position.copy(start);

  bodyParticles.forEach((particle, index) => {
    if (opacity <= 0.02 || length <= 0.05) {
      particle.visible = false;
      return;
    }
    const u = (particle.userData.along + 0.017 * Math.sin(index * 3.19)) % 1;
    const radial = particle.userData.radial * radius;
    const angle = particle.userData.angle + t * particle.userData.orbitSpeed;
    const edgeFade = smoothstep(0.0, 0.08, u) * (1 - smoothstep(0.92, 1.0, u));
    const localOpacity = opacity * particle.userData.baseOpacity * edgeFade;
    const position = start.clone()
      .lerp(end, u)
      .add(axisA.clone().multiplyScalar(Math.cos(angle) * radial))
      .add(axisB.clone().multiplyScalar(Math.sin(angle) * radial));

    particle.position.copy(position);
    particle.quaternion.copy(camera.quaternion);
    particle.rotateZ(angle + particle.userData.spin);
    particle.scale.setScalar(particle.userData.scale);
    particle.material.opacity = localOpacity;
    particle.visible = localOpacity > 0.02;
  });

  updateSphereNoteVisual(head, opacity, head.userData.baseScale, 0);
  if (isSpaceNote(note)) {
    updateSpaceSatellites({ ...note, mesh: head }, t, opacity);
  }
  note.mesh.visible = opacity > 0.02;
}

function updateNotes(t, chartTime) {
  const visibleNotes = [];
  notes.forEach((note) => {
    if (isHoldNote(note)) {
      const segment = holdSegment(note, chartTime);
      const opacity = note.mesh.userData.baseOpacity * holdVisibility(segment.head.progress, segment.tail.progress);
      updateHoldNoteVisual(note, segment, opacity, t);
      if (opacity > 0.02) {
        visibleNotes.push({
          note,
          progress: segment.progress,
          timeToHit: segment.timeToHit,
          opacity,
          visibility: opacity,
          connectionPosition: segment.head.position.clone(),
          wPos: note.wPos
        });
      }
      return;
    }

    const { position, progress, timeToHit } = notePosition(note, chartTime);
    note.mesh.position.copy(position);
    if (!isCentralNote(note)) note.mesh.quaternion.copy(note.zone.noteQuaternion);
    const isCentral = isCentralNote(note);
    const pulseScale = isCentral ? Math.sin(t * 5 + note.pulse) * 0.035 : 0;
    const scale = note.mesh.userData.baseScale * (1 + pulseScale);
    const visibility = noteVisibility(progress);
    const hitFlash = isCentral ? (note.mesh.userData.hitFlash ?? 0) : 0;
    const opacity = note.mesh.userData.baseOpacity * visibility * (1 + hitFlash * 0.45);

    updateSphereNoteVisual(note.mesh, opacity, scale, hitFlash);
    if (isSpaceNote(note)) updateSpaceSatellites(note, t, opacity);
    note.mesh.userData.hitFlash = isCentral ? Math.max(0, hitFlash - 0.08) : 0;
    visibleNotes.push({
      note,
      progress,
      timeToHit,
      opacity,
      visibility,
      connectionPosition: position.clone(),
      wPos: note.wPos
    });
  });
  return visibleNotes;
}

function updateLandingHints(visibleNotes) {
  landingHintPool.forEach((hint) => {
    hint.visible = false;
  });

  let hintIndex = 0;
  visibleNotes.forEach((item) => {
    if (!isCentralNote(item.note)) return;
    if (item.opacity <= 0.025) return;
    const timeToHit = item.timeToHit;
    if (timeToHit < 0 || timeToHit > 1 || hintIndex >= landingHintPool.length) return;

    const targetInfo = getTargetForNote(item.note);
    const nearHit = smoothstep(0.0, 1.0, 1 - timeToHit);
    const hint = landingHintPool[hintIndex];
    hint.position.copy(targetInfo.position);
    hint.quaternion.copy(item.note.zone.receiverQuaternion);
    hint.scale.setScalar(0.75 + nearHit * 0.65);
    hint.material.opacity = item.opacity * (0.08 + nearHit * 0.22);
    hint.visible = true;
    hintIndex += 1;
  });
}

function writeConnectionGeometry(line, a, b, color, opacityScale) {
  const start = a.connectionPosition ?? a.note.mesh.position;
  const end = b.connectionPosition ?? b.note.mesh.position;
  const delta = end.clone().sub(start);
  if (delta.length() <= 0.001) return false;

  const viewDirection = camera.position.clone().sub(start.clone().add(end).multiplyScalar(0.5)).normalize();
  const side = delta.clone().cross(viewDirection).normalize().multiplyScalar(renderConfig.multiHitLineWidth * 0.5);
  const positions = [];
  const colors = [];
  const alphas = [];
  const indices = [];
  const segmentCount = 1;

  for (let i = 0; i <= segmentCount; i += 1) {
    const u = i / segmentCount;
    const point = start.clone().lerp(end, u);
    const alpha = THREE.MathUtils.lerp(a.opacity, b.opacity, u) * opacityScale;
    positions.push(
      point.x + side.x, point.y + side.y, point.z + side.z,
      point.x - side.x, point.y - side.y, point.z - side.z
    );
    colors.push(color.r, color.g, color.b, color.r, color.g, color.b);
    alphas.push(alpha, alpha);
  }

  for (let i = 0; i < segmentCount; i += 1) {
    const base = i * 2;
    indices.push(base, base + 1, base + 2, base + 1, base + 3, base + 2);
  }

  line.geometry.dispose();
  line.geometry = new THREE.BufferGeometry();
  line.geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  line.geometry.setAttribute("lineColor", new THREE.Float32BufferAttribute(colors, 3));
  line.geometry.setAttribute("lineAlpha", new THREE.Float32BufferAttribute(alphas, 1));
  line.geometry.setIndex(indices);
  line.visible = true;
  return true;
}

function updateMultiHitLines(visibleNotes) {
  linePool.forEach((line) => {
    line.visible = false;
  });

  let lineIndex = 0;
  const groups = new Map();
  visibleNotes.forEach((item) => {
    if (!isCentralNote(item.note)) return;
    if (!groups.has(item.note.hitGroup)) groups.set(item.note.hitGroup, []);
    groups.get(item.note.hitGroup).push(item);
  });

  for (const group of groups.values()) {
    const sortedGroup = group
      .filter((item) => item.opacity > 0.02)
      .sort((a, b) => (a.wPos ?? 0) - (b.wPos ?? 0));
    for (let i = 0; i < sortedGroup.length - 1; i += 1) {
      const a = sortedGroup[i];
      const b = sortedGroup[i + 1];
      if (lineIndex >= linePool.length || a.opacity <= 0.02 || b.opacity <= 0.02) continue;
      if (writeConnectionGeometry(linePool[lineIndex], a, b, palette.white, 0.34)) lineIndex += 1;
    }
  }
}

function updateReceiver(t, beat) {
  receiverRing.scale.setScalar(1 + beat * 0.018);
  receiverGroup.position.copy(receiverState.anchor);
  receiverGroup.quaternion.copy(receiverState.currentQuaternion);
  receiverGroup.updateMatrixWorld(true);
  const receiverWorldQuaternion = new THREE.Quaternion();
  receiverGroup.getWorldQuaternion(receiverWorldQuaternion);
  const billboardQuaternion = receiverWorldQuaternion.invert().multiply(camera.quaternion);
  receiverSquareParticles.forEach((square, index) => {
    const phase = (square.userData.ySeed + t * square.userData.speed) % 1;
    const rise = phase * 2.45;
    const angle = square.userData.angle
      + t * square.userData.orbitSpeed
      + Math.sin(t * 0.16 + index) * 0.025;
    const radial = square.userData.radius + square.userData.radialDrift * phase;
    const tangent = square.userData.tangentDrift * phase;
    const radialX = Math.cos(angle);
    const radialZ = Math.sin(angle);
    const tangentX = -radialZ;
    const tangentZ = radialX;
    square.position.set(
      radialX * radial + tangentX * tangent,
      0.2 + rise,
      radialZ * radial + tangentZ * tangent
    );
    square.quaternion.copy(billboardQuaternion);
    square.rotateZ(t * (0.18 + (index % 4) * 0.07) + index);
    square.material.opacity = square.userData.baseOpacity
      * (1 - smoothstep(0.66, 1.0, phase))
      * smoothstep(0.0, 0.14, phase);
  });
}

function updateReceiverAnchor() {
  const state = receiverStateAt(chartState.chartTime);
  receiverState.currentZone = state.zone;
  receiverState.targetZone = state.targetZone;
  receiverState.currentPosition.copy(state.position);
  receiverState.targetPosition.copy(state.targetZone.receiverPosition);
  receiverState.currentQuaternion.copy(state.quaternion);
  receiverState.targetQuaternion.copy(state.targetZone.receiverQuaternion);
  receiverState.moving = state.moving;
  receiverState.progress = state.progress;
  receiverState.anchor.copy(receiverState.currentPosition);
}

function animate() {
  const t = clock.getElapsedTime();
  const beat = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 * 1.2);
  const slowBeat = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 * 0.4);

  chartState.chartTime = ((t - chartState.startTime) % timingConfig.chartDuration + timingConfig.chartDuration) % timingConfig.chartDuration;
  updateReceiverAnchor();
  particlesRoot.rotation.y = -t * 0.035;
  const visibleNotes = updateNotes(t, chartState.chartTime);
  updateLandingHints(visibleNotes);
  updateMultiHitLines(visibleNotes);

  if (debugFreeCamera) {
    controls.update();
  } else {
    const cameraOffset = currentCameraOffset();
    const target = applyCameraProfile(t, slowBeat, receiverState.anchor, receiverState.currentQuaternion, cameraOffset);
    controls.target.copy(target);
  }
  updateCameraDebug();
  updateReceiver(t, beat);

  composer.render();
  requestAnimationFrame(animate);
}

animate();
</script>
