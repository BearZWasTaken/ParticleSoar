};

function applyCameraProfile(
  t = 0,
  bob = 0,
  anchor = new THREE.Vector3(),
  orientation = new THREE.Quaternion(),
  offset = {}
) {
  camera.fov = cameraProfile.fov;
  camera.near = cameraProfile.near;
  camera.far = cameraProfile.far;
  if (offset.fov) camera.fov += offset.fov;

  const localPosition = cameraProfile.position.clone().add(new THREE.Vector3(
    (offset.x ?? 0) + Math.sin(t * 0.16) * cameraProfile.swayX,
    (offset.y ?? 0) + bob * cameraProfile.bobY,
    offset.z ?? 0
  ));
  const localTarget = cameraProfile.lookAt.clone().add(new THREE.Vector3(
    offset.targetX ?? 0,
    offset.targetY ?? 0,
    offset.targetZ ?? 0
  ));
  const followPosition = cameraMount.configured
    ? localPosition.sub(cameraMount.referenceReceiverPosition)
    : localPosition;
  const followTarget = cameraMount.configured
    ? localTarget.sub(cameraMount.referenceReceiverPosition)
    : localTarget;
  const worldPosition = anchor.clone().add(followPosition.applyQuaternion(orientation));
  const worldTarget = anchor.clone().add(followTarget.applyQuaternion(orientation));

  camera.position.copy(worldPosition);
  camera.lookAt(worldTarget);
  camera.updateProjectionMatrix();
  return worldTarget;
}

}

const particleSizeScales = new Float32Array(backgroundConfig.maxPoints);

particleGeo.setAttribute("backgroundSizeScale", new THREE.BufferAttribute(particleSizeScales, 1));

function installBackgroundOcclusionShader(material, cacheKey, { scalePoints = false } = {}) {
  material.onBeforeCompile = (shader) => {
    shader.uniforms.nearFadeStart = { value: backgroundConfig.nearFadeStart };
    shader.uniforms.nearFadeEnd = { value: backgroundConfig.nearFadeEnd };
    shader.uniforms.leftClearPath = { value: Array.from({ length: sideTrajectoryPointCount }, () => new THREE.Vector2(-0.3, 0)) };
    shader.uniforms.rightClearPath = { value: Array.from({ length: sideTrajectoryPointCount }, () => new THREE.Vector2(0.3, 0)) };
    shader.uniforms.clearPathCount = { value: 0 };
    shader.uniforms.clearPlanePointView = { value: new THREE.Vector3(0, 0, -gameConfig.camera.position[2]) };
    shader.uniforms.clearPlaneNormalView = { value: new THREE.Vector3(0, 0, 1) };
    shader.uniforms.clearPlaneCameraSign = { value: 1 };
    shader.uniforms.clearPlaneFeather = { value: backgroundConfig.playfieldClearDepthFeather };
    material.userData.shader = shader;
    shader.vertexShader = `
      ${scalePoints ? "attribute float backgroundSizeScale;" : ""}
      varying vec2 vBackgroundNdc;
      varying float vBackgroundViewDepth;
      varying vec3 vBackgroundViewPosition;
      ${shader.vertexShader}
    `
      .replace(
        "#include <project_vertex>",
        `
          #include <project_vertex>
          vBackgroundNdc = gl_Position.xy / max(abs(gl_Position.w), 0.0001);
          vBackgroundViewDepth = -mvPosition.z;
          vBackgroundViewPosition = mvPosition.xyz;
        `
      );
    if (scalePoints) {
      shader.vertexShader = shader.vertexShader.replace(
        /\}\s*$/,
        `
          gl_PointSize *= backgroundSizeScale;
        }
        `
      );
    }
    shader.fragmentShader = `
      uniform float nearFadeStart;
      uniform float nearFadeEnd;
      uniform vec2 leftClearPath[${sideTrajectoryPointCount}];
      uniform vec2 rightClearPath[${sideTrajectoryPointCount}];
      uniform int clearPathCount;
      uniform vec3 clearPlanePointView;
      uniform vec3 clearPlaneNormalView;
      uniform float clearPlaneCameraSign;
      uniform float clearPlaneFeather;
      varying vec2 vBackgroundNdc;
      varying float vBackgroundViewDepth;
      varying vec3 vBackgroundViewPosition;
      float cross2d(vec2 a, vec2 b) {
        return a.x * b.y - a.y * b.x;
      }
      float insideTriangle(vec2 p, vec2 a, vec2 b, vec2 c) {
        float d1 = cross2d(b - a, p - a);
        float d2 = cross2d(c - b, p - b);
        float d3 = cross2d(a - c, p - c);
        float hasNegative = step(min(min(d1, d2), d3), -0.00001);
        float hasPositive = step(0.00001, max(max(d1, d2), d3));
        return 1.0 - hasNegative * hasPositive;
      }
      ${shader.fragmentShader}
    `.replace(
      /\}\s*$/,
      `
        float nearMask = smoothstep(nearFadeStart, nearFadeEnd, vBackgroundViewDepth);
        float insideChannel = 0.0;
        for (int i = 0; i < ${sideTrajectoryPointCount - 1}; i++) {
          if (i >= clearPathCount - 1) break;
          vec2 leftA = leftClearPath[i];
          vec2 rightA = rightClearPath[i];
          vec2 leftB = leftClearPath[i + 1];
          vec2 rightB = rightClearPath[i + 1];
          insideChannel = max(insideChannel, insideTriangle(vBackgroundNdc, leftA, rightA, rightB));
          insideChannel = max(insideChannel, insideTriangle(vBackgroundNdc, leftA, rightB, leftB));
        }
        float planeDistance = dot(
          vBackgroundViewPosition - clearPlanePointView,
          clearPlaneNormalView
        ) * clearPlaneCameraSign;
        float inFront = smoothstep(-clearPlaneFeather, clearPlaneFeather, planeDistance);
        float playfieldMask = 1.0 - insideChannel * inFront;
        if (nearMask * playfieldMask <= 0.001) discard;
        gl_FragColor.a *= nearMask * playfieldMask;
      }
      `
    );
  };
  material.customProgramCacheKey = () => cacheKey;
  return material;
}

function makeHollowEquilateralTriangleGeometry(side = 1.65, thicknessRatio = 0.38) {
  const height = side * Math.sqrt(3) * 0.5;
  const outer = [
    new THREE.Vector2(0, height * 2 / 3),
    new THREE.Vector2(side * 0.5, -height / 3),
    new THREE.Vector2(-side * 0.5, -height / 3)
  ];
  const innerScale = THREE.MathUtils.clamp(1 - thicknessRatio, 0.18, 0.82);
  const inner = outer.map((point) => point.clone().multiplyScalar(innerScale)).reverse();
  const shape = new THREE.Shape(outer);
  const hole = new THREE.Path(inner);
  shape.holes.push(hole);
  return new THREE.ShapeGeometry(shape);
}

function makeBackgroundTriangleMaterial() {
  return installBackgroundOcclusionShader(

}

const backgroundTriangleGeo = makeHollowEquilateralTriangleGeometry(0.82, 0.42);

backgroundTriangleMesh.count = 0;

const backgroundActiveCell = new THREE.Vector3(Number.NaN, Number.NaN, Number.NaN);
const backgroundInstanceMatrix = new THREE.Matrix4();
const backgroundInstancePosition = new THREE.Vector3();
const backgroundInstanceQuaternion = new THREE.Quaternion();
const backgroundInstanceScale = new THREE.Vector3();
const backgroundInstanceEuler = new THREE.Euler();
const backgroundInstanceColor = new THREE.Color();
const leftTrajectoryWorldPoints = Array.from({ length: sideTrajectoryPointCount }, () => new THREE.Vector3());
const rightTrajectoryWorldPoints = Array.from({ length: sideTrajectoryPointCount }, () => new THREE.Vector3());
const leftTrajectoryNdcPoints = Array.from({ length: sideTrajectoryPointCount }, () => new THREE.Vector3());
const rightTrajectoryNdcPoints = Array.from({ length: sideTrajectoryPointCount }, () => new THREE.Vector3());
let sideTrajectorySampleCount = 0;
const backgroundReceiverViewPosition = new THREE.Vector3();
const backgroundReceiverPlaneNormalWorld = new THREE.Vector3();
const backgroundReceiverPlaneNormalView = new THREE.Vector3();

function hashBackgroundCell(x, y, z, salt = 0) {
  let hash = Math.imul(x, 0x1f123bb5)
    ^ Math.imul(y, 0x5f356495)
    ^ Math.imul(z, 0x6c8e9cf5)
    ^ Math.imul(salt, 0x27d4eb2d);
  hash = Math.imul(hash ^ (hash >>> 15), 0x2c1b3c6d);
  hash = Math.imul(hash ^ (hash >>> 12), 0x297a2d39);
  return (hash ^ (hash >>> 15)) >>> 0;
}

function backgroundRandom(x, y, z, salt) {
  return hashBackgroundCell(x, y, z, salt) / 0x100000000;
}

function rebuildBackgroundField(force = false) {
  const cellSize = backgroundConfig.cellSize;
  const cellX = Math.floor(camera.position.x / cellSize);
  const cellY = Math.floor(camera.position.y / cellSize);
  const cellZ = Math.floor(camera.position.z / cellSize);
  if (!force
    && cellX === backgroundActiveCell.x
    && cellY === backgroundActiveCell.y
    && cellZ === backgroundActiveCell.z) return;

  backgroundActiveCell.set(cellX, cellY, cellZ);
  const loadRadius = backgroundConfig.loadRadius;
  const loadRadiusSq = loadRadius * loadRadius;
  const cellRadius = Math.ceil(loadRadius / cellSize);
  const cellMargin = cellSize * Math.sqrt(3) * 0.5;
  const cellLoadRadiusSq = (loadRadius + cellMargin) ** 2;
  const fieldCenter = new THREE.Vector3(
    (cellX + 0.5) * cellSize,
    (cellY + 0.5) * cellSize,
    (cellZ + 0.5) * cellSize
  );
  let pointCount = 0;
  let triangleCount = 0;

  for (let x = cellX - cellRadius; x <= cellX + cellRadius; x += 1) {
    for (let y = cellY - cellRadius; y <= cellY + cellRadius; y += 1) {
      for (let z = cellZ - cellRadius; z <= cellZ + cellRadius; z += 1) {
        const centerX = (x + 0.5) * cellSize;
        const centerY = (y + 0.5) * cellSize;
        const centerZ = (z + 0.5) * cellSize;
        const centerDx = centerX - fieldCenter.x;
        const centerDy = centerY - fieldCenter.y;
        const centerDz = centerZ - fieldCenter.z;
        if (centerDx * centerDx + centerDy * centerDy + centerDz * centerDz
          > cellLoadRadiusSq) continue;

        for (let sample = 0; sample < backgroundConfig.pointsPerCell; sample += 1) {
          if (pointCount >= backgroundConfig.maxPoints) break;
          const salt = 20 + sample * 4;
          if (backgroundRandom(x, y, z, salt) >= backgroundConfig.pointChance) continue;
          const px = (x + backgroundRandom(x, y, z, salt + 1)) * cellSize;
          const py = (y + backgroundRandom(x, y, z, salt + 2)) * cellSize;
          const pz = (z + backgroundRandom(x, y, z, salt + 3)) * cellSize;
          const dx = px - fieldCenter.x;
          const dy = py - fieldCenter.y;
          const dz = pz - fieldCenter.z;
          if (dx * dx + dy * dy + dz * dz > loadRadiusSq) continue;
          const offset = pointCount * 3;
          particlePositions[offset] = px;
          particlePositions[offset + 1] = py;
          particlePositions[offset + 2] = pz;
          particleSizeScales[pointCount] = 1 + backgroundRandom(x, y, z, salt + 1000);
          pointCount += 1;
        }

        for (let sample = 0; sample < backgroundConfig.trianglesPerCell; sample += 1) {
          if (triangleCount >= backgroundConfig.maxTriangles) break;
          const salt = 140 + sample * 14;
          if (backgroundRandom(x, y, z, salt) >= backgroundConfig.triangleChance) continue;
          const px = (x + backgroundRandom(x, y, z, salt + 1)) * cellSize;
          const py = (y + backgroundRandom(x, y, z, salt + 2)) * cellSize;
          const pz = (z + backgroundRandom(x, y, z, salt + 3)) * cellSize;
          const dx = px - fieldCenter.x;
          const dy = py - fieldCenter.y;
          const dz = pz - fieldCenter.z;
          if (dx * dx + dy * dy + dz * dz > loadRadiusSq) continue;
          backgroundInstancePosition.set(px, py, pz);
          backgroundInstanceEuler.set(
            (backgroundRandom(x, y, z, salt + 4) - 0.5) * 0.35,
            (backgroundRandom(x, y, z, salt + 5) - 0.5) * 0.35,
            backgroundRandom(x, y, z, salt + 6) * Math.PI * 2
          );
          backgroundInstanceQuaternion.setFromEuler(backgroundInstanceEuler);
          const scale = 0.52 + backgroundRandom(x, y, z, salt + 7) * 0.72;
          backgroundInstanceScale.setScalar(scale);
          backgroundInstanceMatrix.compose(
            backgroundInstancePosition,
            backgroundInstanceQuaternion,
            backgroundInstanceScale
          );
          backgroundTriangleMesh.setMatrixAt(triangleCount, backgroundInstanceMatrix);
          backgroundInstanceColor.set(0xe8f3f7)
            .multiplyScalar(0.58 + backgroundRandom(x, y, z, salt + 8) * 0.5);
          backgroundTriangleMesh.setColorAt(triangleCount, backgroundInstanceColor);
          triangleCount += 1;
        }
      }
    }
  }

  particleGeo.setDrawRange(0, pointCount);
  particleGeo.getAttribute("position").needsUpdate = true;
  particleGeo.getAttribute("backgroundSizeScale").needsUpdate = true;
  backgroundTriangleMesh.count = triangleCount;
  backgroundTriangleMesh.instanceMatrix.needsUpdate = true;
  if (backgroundTriangleMesh.instanceColor) backgroundTriangleMesh.instanceColor.needsUpdate = true;
}

function updateBackgroundParticles() {
  particlesRoot.position.set(0, 0, 0);
  particlesRoot.quaternion.identity();
  rebuildBackgroundField();

  camera.updateMatrixWorld(true);
  for (let i = 0; i < sideTrajectorySampleCount; i += 1) {
    leftTrajectoryNdcPoints[i].copy(leftTrajectoryWorldPoints[i]).project(camera);
    rightTrajectoryNdcPoints[i].copy(rightTrajectoryWorldPoints[i]).project(camera);
  }
  backgroundReceiverViewPosition
    .copy(receiverState.currentPosition)
    .applyMatrix4(camera.matrixWorldInverse);
  backgroundReceiverPlaneNormalWorld
    .set(0, 0, 1)
    .applyQuaternion(receiverState.currentQuaternion)
    .normalize();
  backgroundReceiverPlaneNormalView
    .copy(backgroundReceiverPlaneNormalWorld)
    .transformDirection(camera.matrixWorldInverse);

  const clearPlaneCameraSign = Math.sign(
    -backgroundReceiverViewPosition.dot(backgroundReceiverPlaneNormalView)
  ) || 1;
  const planeValuesAreFinite = Number.isFinite(backgroundReceiverViewPosition.x)
    && Number.isFinite(backgroundReceiverViewPosition.y)
    && Number.isFinite(backgroundReceiverViewPosition.z)
    && Number.isFinite(backgroundReceiverPlaneNormalView.x)
    && Number.isFinite(backgroundReceiverPlaneNormalView.y)
    && Number.isFinite(backgroundReceiverPlaneNormalView.z)
    && Number.isFinite(clearPlaneCameraSign);
  if (!planeValuesAreFinite) return;
  for (let i = 0; i < sideTrajectorySampleCount; i += 1) {
    const leftPoint = leftTrajectoryNdcPoints[i];
    const rightPoint = rightTrajectoryNdcPoints[i];
    if (!Number.isFinite(leftPoint.x)
      || !Number.isFinite(leftPoint.y)
      || !Number.isFinite(rightPoint.x)
      || !Number.isFinite(rightPoint.y)) return;
  }

  const updateObstructionVolume = (shader) => {
    if (!shader) return;
    for (let i = 0; i < sideTrajectorySampleCount; i += 1) {
      shader.uniforms.leftClearPath.value[i].copy(leftTrajectoryNdcPoints[i]);
      shader.uniforms.rightClearPath.value[i].copy(rightTrajectoryNdcPoints[i]);
    }
    shader.uniforms.clearPathCount.value = sideTrajectorySampleCount;
    shader.uniforms.clearPlanePointView.value.copy(backgroundReceiverViewPosition);
    shader.uniforms.clearPlaneNormalView.value.copy(backgroundReceiverPlaneNormalView);
    shader.uniforms.clearPlaneCameraSign.value = clearPlaneCameraSign;
  };
  updateObstructionVolume(particles.material.userData.shader);
  updateObstructionVolume(backgroundTriangleMesh.material.userData.shader);
}

const noteHaloGeo = new THREE.SphereGeometry(0.25, 32, 18);

const notes = [];
const linePool = [];
const landingHintPool = [];
const holdRenderPosition = new THREE.Vector3();
const holdRenderDelta = new THREE.Vector3();
const holdRenderDirection = new THREE.Vector3();
const holdRenderAxisA = new THREE.Vector3();
const holdRenderAxisB = new THREE.Vector3();

const gameplayState = {

  previewTime: null

const receiverState = {
  anchor: new THREE.Vector3(0, playfieldConfig.noteHitY, 0),
  currentPosition: new THREE.Vector3(0, playfieldConfig.noteHitY, 0),
  currentQuaternion: new THREE.Quaternion(),
};

const clock = new THREE.Clock();

function getLandingHintTransform(note) {
  if (chartState.motionMode === "receiver-catch") {
    const pose = {
      position: receiverState.currentPosition,
      quaternion: receiverState.currentQuaternion
    };
    return {
      position: pointFromReceiverPose(
        pose,
        note.localX ?? note.wPos ?? 0,
        note.depthOffset ?? 0
      ),
      quaternion: receiverState.currentQuaternion
    };
  }

  return {
    position: localPointInZone(zone, note.localX ?? note.wPos ?? 0, note.depthOffset ?? 0),
    quaternion: zone.receiverQuaternion
  };
}

function zoneFromReceiverPose(pose, fallback = createDropZone()) {
  const judgeLineDirection = new THREE.Vector3(1, 0, 0).applyQuaternion(pose.quaternion).normalize();
  const fallDirection = new THREE.Vector3(0, -1, 0).applyQuaternion(pose.quaternion).normalize();
  return createDropZone({
    receiverPosition: pose.position,
    judgeLineDirection,
    fallDirection
  }, fallback);
}

function laneX(lane, phase) {
  return -4.2 + ((lane * 1.68 + phase * 9.6) % 8.4);
}

function randomDepthOffset() {
  return (Math.random() * 2 - 1) * playfieldConfig.zSpread;
}

function normalizeVector(value, fallback) {
  const vector = toVector3(value, fallback);
  return vector.lengthSq() > 0.000001 ? vector.normalize() : fallback.clone().normalize();
}

function directionFromAngles(azimuth = 0, elevation = 0) {
  const horizontal = Math.cos(elevation);
  return new THREE.Vector3(
    Math.cos(azimuth) * horizontal,
    Math.sin(elevation),
    Math.sin(azimuth) * horizontal
  ).normalize();
}

function perpendicularTo(axis, preferred = new THREE.Vector3(0, -1, 0)) {
  let projected = preferred.clone().sub(axis.clone().multiplyScalar(preferred.dot(axis)));
  if (projected.lengthSq() < 0.000001) {
    projected = new THREE.Vector3(1, 0, 0).sub(axis.clone().multiplyScalar(axis.x));
  }
  if (projected.lengthSq() < 0.000001) {
    projected = new THREE.Vector3(0, 0, 1).sub(axis.clone().multiplyScalar(axis.z));
  }
  return projected.normalize();
}

function fallDirectionFromAngle(judgeLineDirection, fallAngle = 0) {
  return perpendicularTo(judgeLineDirection).applyAxisAngle(judgeLineDirection, fallAngle).normalize();
}

function quaternionFromXY(xAxis, yAxis) {
  const x = xAxis.clone().normalize();
  const y = yAxis.clone().normalize();
  const z = new THREE.Vector3().crossVectors(x, y).normalize();
  const correctedY = new THREE.Vector3().crossVectors(z, x).normalize();
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, correctedY, z));
}

function createDropZone(raw = {}, fallback = {}) {
  const receiverPosition = toVector3(
    raw.receiverPosition ?? raw.position ?? raw.zonePosition,
    fallback.receiverPosition ?? new THREE.Vector3(0, playfieldConfig.noteHitY, 0)
  );
  const judgeLineDirection = raw.judgeLineDirection
    ? normalizeVector(raw.judgeLineDirection, fallback.judgeLineDirection ?? new THREE.Vector3(1, 0, 0))
    : raw.judgeLineAngles
      ? directionFromAngles(raw.judgeLineAngles[0] ?? 0, raw.judgeLineAngles[1] ?? 0)
      : raw.judgeLineAzimuth !== undefined || raw.judgeLineElevation !== undefined
        ? directionFromAngles(raw.judgeLineAzimuth ?? 0, raw.judgeLineElevation ?? 0)
        : normalizeVector(fallback.judgeLineDirection, new THREE.Vector3(1, 0, 0));
  let fallDirection = raw.fallDirection
    ? normalizeVector(raw.fallDirection, fallback.fallDirection ?? new THREE.Vector3(0, -1, 0))
    : fallback.fallDirection && raw.fallAngle === undefined
      ? normalizeVector(fallback.fallDirection, new THREE.Vector3(0, -1, 0))
      : fallDirectionFromAngle(judgeLineDirection, raw.fallAngle ?? fallback.fallAngle ?? 0);
  fallDirection = fallDirection
    .sub(judgeLineDirection.clone().multiplyScalar(fallDirection.dot(judgeLineDirection)))
    .normalize();
  if (fallDirection.lengthSq() < 0.000001) fallDirection.copy(perpendicularTo(judgeLineDirection));
  const depthDirection = new THREE.Vector3().crossVectors(judgeLineDirection, fallDirection).normalize();
  const receiverQuaternion = quaternionFromXY(judgeLineDirection, fallDirection.clone().negate());
  const noteQuaternion = quaternionFromXY(judgeLineDirection, fallDirection.clone().negate());

  return {
    receiverPosition,
    judgeLineDirection,
    fallDirection,
    depthDirection,
    receiverQuaternion,
    noteQuaternion,
    travelDistance: raw.travelDistance ?? fallback.travelDistance ?? Math.abs(playfieldConfig.noteStartY - playfieldConfig.noteHitY)
  };
}

function localPointInZone(zone, localX = 0, depthOffset = 0) {
  return zone.receiverPosition.clone()
    .add(zone.judgeLineDirection.clone().multiplyScalar(localX))
    .add(zone.depthDirection.clone().multiplyScalar(depthOffset));
}

function normalizeTimeline(events = [], defaultValue = 0) {
  return {
    defaultValue,
    events: [...events].sort((a, b) => a.startTime - b.startTime || a.endTime - b.endTime)
  };
}

function curveValue(event, localTime) {
  const duration = Math.max(0.0001, event.endTime - event.startTime);
  const raw = THREE.MathUtils.clamp(localTime / duration, 0, 1);
  const curve = event.curve ?? "linear";
  const u = curve === "easeInCubic"
    ? raw * raw * raw
    : curve === "smoothstep"
      ? raw * raw * (3 - 2 * raw)
      : raw;
  const from = event.from ?? event.value ?? 0;
  const to = event.to ?? event.value ?? from;
  return THREE.MathUtils.lerp(from, to, u);
}

function evaluateTimeline(timeline, chartTime) {
  if (!timeline) return 0;
  let previous = null;
  let next = null;
  for (const event of timeline.events) {
    if (event.startTime <= chartTime && chartTime < event.endTime) {
      return curveValue(event, chartTime - event.startTime);
    }
    if (event.startTime <= chartTime) previous = event;
    if (event.startTime > chartTime) {
      next = event;
      break;
    }
  }
  if (previous) return curveValue(previous, previous.endTime - previous.startTime);
  if (next) return curveValue(next, 0);
  return timeline.defaultValue;
}

function currentFlowSpeed() {
  return Math.max(0.001, evaluateTimeline(chartState.flowSpeedTimeline, chartState.chartTime));
}

function currentCameraOffset() {
  return {
    x: evaluateTimeline(chartState.cameraTimelines.x, chartState.chartTime),
    y: evaluateTimeline(chartState.cameraTimelines.y, chartState.chartTime),
    z: evaluateTimeline(chartState.cameraTimelines.z, chartState.chartTime),
    targetX: evaluateTimeline(chartState.cameraTimelines.targetX, chartState.chartTime),
    targetY: evaluateTimeline(chartState.cameraTimelines.targetY, chartState.chartTime),
    targetZ: evaluateTimeline(chartState.cameraTimelines.targetZ, chartState.chartTime),
    fov: evaluateTimeline(chartState.cameraTimelines.fov, chartState.chartTime)
  };
}

function zoneFromReceiverEvent(event, fallbackZone) {
  const receiverPosition = toVector3(
    event.receiverPosition ?? event.position ?? event.targetPosition ?? event.target,
    fallbackZone.receiverPosition
  );
  if (event.x !== undefined || event.y !== undefined || event.z !== undefined) {
    receiverPosition.set(
      event.x ?? receiverPosition.x,
      event.y ?? receiverPosition.y,
      event.z ?? receiverPosition.z
    );
  }
  return createDropZone({ ...event, receiverPosition }, fallbackZone);
}

function buildReceiverTimeline(rawEvents = []) {
  const sortedEvents = [...rawEvents].sort((a, b) => a.hitTime - b.hitTime);
  const events = [];
  const transitions = [];
  let previousZone = createDropZone();

  if (sortedEvents.length === 0 || sortedEvents[0].hitTime > 0) {
    events.push({
      hitTime: 0,
      zone: previousZone,
      raw: { hitTime: 0 }
    });
  }

  sortedEvents.forEach((event) => {
    const zone = zoneFromReceiverEvent(event, previousZone);
    events.push({
      hitTime: event.hitTime ?? 0,
      zone,
      raw: event
    });
    previousZone = zone;
  });

  for (let i = 1; i < events.length; i += 1) {
    const event = events[i];
    const duration = Math.max(0, event.raw.moveSeconds ?? event.raw.duration ?? timingConfig.receiverMoveSeconds);
    transitions.push({
      startTime: event.hitTime,
      endTime: event.hitTime + duration,
      fromZone: events[i - 1].zone,
      toZone: event.zone,
      curve: event.raw.curve ?? "smoothstep"
    });
  }

  return { events, transitions };
}

function normalizeReceiverMotion(rawMotion = {}) {
  const values = Array.isArray(rawMotion)
    ? rawMotion
    : rawMotion.values ?? rawMotion.directionSpeed ?? [
      rawMotion.azimuth ?? 0,
      rawMotion.elevation ?? 0,
      rawMotion.speed ?? 0
    ];
  return {
    azimuth: values[0] ?? 0,
    elevation: values[1] ?? 0,
    speed: values[2] ?? 0,
    azimuthVelocity: rawMotion.azimuthVelocity ?? 0,
    sampleSeconds: rawMotion.sampleSeconds ?? 0.2,
    origin: toVector3(rawMotion.origin, new THREE.Vector3(0, playfieldConfig.noteHitY, 0))
  };
}

function receiverZoneAtMotionTime(motion, time) {
  const horizontalSpeed = motion.speed * Math.cos(motion.elevation);
  const verticalSpeed = motion.speed * Math.sin(motion.elevation);
  const angularSpeed = motion.azimuthVelocity;
  const currentAzimuth = motion.azimuth + angularSpeed * time;
  const movementDirection = directionFromAngles(currentAzimuth, motion.elevation);
  const receiverPosition = motion.origin.clone();
  if (Math.abs(angularSpeed) < 0.000001) {
    receiverPosition.add(
      directionFromAngles(motion.azimuth, motion.elevation)
        .multiplyScalar(motion.speed * time)
    );
  } else {
    receiverPosition.add(new THREE.Vector3(
      horizontalSpeed / angularSpeed * (Math.sin(currentAzimuth) - Math.sin(motion.azimuth)),
      verticalSpeed * time,
      horizontalSpeed / angularSpeed * (Math.cos(motion.azimuth) - Math.cos(currentAzimuth))
    ));
  }
  const judgeLineDirection = Math.abs(angularSpeed) < 0.000001
    ? new THREE.Vector3(1, 0, 0)
    : new THREE.Vector3(-Math.sin(currentAzimuth), 0, Math.cos(currentAzimuth)).normalize();
  return {
    receiverPosition: receiverPosition.toArray(),
    judgeLineDirection: judgeLineDirection.toArray(),
    fallDirection: movementDirection.clone().negate().toArray()
  };
}

function buildReceiverEventsFromMotion(rawMotion, duration) {
  const motion = normalizeReceiverMotion(rawMotion);
  const events = [{ hitTime: 0, moveSeconds: 0, ...receiverZoneAtMotionTime(motion, 0) }];
  for (let t = motion.sampleSeconds; t <= duration + 0.01; t += motion.sampleSeconds) {
    events.push({
      hitTime: Math.max(0, t - motion.sampleSeconds),
      moveSeconds: motion.sampleSeconds,
      curve: "linear",
      ...receiverZoneAtMotionTime(motion, Math.min(t, duration))
    });
  }
  return events;
}

function transitionProgress(transition, chartTime) {
  const duration = Math.max(0.0001, transition.endTime - transition.startTime);
  const raw = THREE.MathUtils.clamp((chartTime - transition.startTime) / duration, 0, 1);
  if (transition.curve === "linear") return raw;
  if (transition.curve === "easeInCubic") return raw * raw * raw;
  if (transition.curve === "easeOutCubic") return 1 - Math.pow(1 - raw, 3);
  return raw * raw * (3 - 2 * raw);
}

function interpolateReceiverZones(fromZone, toZone, progress) {
  return {
    position: fromZone.receiverPosition.clone().lerp(toZone.receiverPosition, progress),
    quaternion: fromZone.receiverQuaternion.clone().slerp(toZone.receiverQuaternion, progress)
  };
}

function lastItemAtOrBefore(items, chartTime, getTime) {
  let low = 0;
  let high = items.length - 1;
  let result = -1;
  while (low <= high) {
    const middle = (low + high) >> 1;
    if (getTime(items[middle]) <= chartTime) {
      result = middle;
      low = middle + 1;
    } else {
      high = middle - 1;
    }
  }
  return result;
}

function sampleReceiverTimeline(events, transitions, chartTime) {
  if (events.length === 0) {
    const zone = createDropZone();
    return {
      position: zone.receiverPosition.clone(),
      quaternion: zone.receiverQuaternion.clone()
    };
  }

  const transitionIndex = lastItemAtOrBefore(transitions, chartTime, (transition) => transition.startTime);
  const transition = transitions[transitionIndex];
  if (transition && chartTime < transition.endTime) {
    return interpolateReceiverZones(
      transition.fromZone,
      transition.toZone,
      transitionProgress(transition, chartTime)
    );
  }

  const eventIndex = Math.max(0, lastItemAtOrBefore(events, chartTime, (event) => event.hitTime));
  const activeEvent = events[eventIndex];
  return {
    position: activeEvent.zone.receiverPosition.clone(),
    quaternion: activeEvent.zone.receiverQuaternion.clone()
  };
}

function pointFromReceiverPose(pose, localX = 0, depthOffset = 0, target = new THREE.Vector3()) {
  return target
    .set(localX, 0, -depthOffset)
    .applyQuaternion(pose.quaternion)
    .add(pose.position);
}

function createReceiverTrajectory(events, transitions, duration) {
  const fixedEvents = [...events];
  const fixedTransitions = [...transitions];
  const sample = (chartTime) => sampleReceiverTimeline(fixedEvents, fixedTransitions, chartTime);
  return Object.freeze({
    duration,
    sample,
    pointAt(chartTime, localX = 0, depthOffset = 0, target = new THREE.Vector3()) {
      return pointFromReceiverPose(sample(chartTime), localX, depthOffset, target);
    }
  });
}

function sampleReceiverPose(chartTime) {
  return chartState.receiverTrajectory.sample(chartTime);
}

function createNoteMesh(kind = "middle") {
  const isSpace = kind === "space";
  const color = isSpace
    ? palette.space
    : kind === "left"
      ? palette.left
      : kind === "right"
        ? palette.right
        : palette.white;
  const mesh = new THREE.Mesh(
    sphereGeo,
    isSpace ? matSpace.clone() : kind === "middle" ? matMiddle.clone() : makeHotGlowMaterial(color, 0.99, 2.18)
  );
  const halo = new THREE.Mesh(
    noteHaloGeo,
    makeHotGlowMaterial(color, 0.56, 1.9)
  );
  halo.userData.baseOpacity = 0.56;
  halo.scale.setScalar(middleHaloScale);
  mesh.add(halo);
  mesh.userData.halo = halo;
  if (isSpace) {
    const satellites = Array.from({ length: 4 }, (_, index) => {
      const satellite = new THREE.Mesh(
        sphereGeo,
        makeHotGlowMaterial(palette.space, 0.82, 2.05)
      );
      const axis = normalizeVector({
        x: Math.sin(index * 1.71),
        y: Math.cos(index * 2.23),
        z: Math.sin(index * 2.91 + 0.7)
      }, new THREE.Vector3(0, 1, 0));
      satellite.userData = {
        axis,
        radius: 0.7 + (index % 5) * 0.05,
        phase: index * 0.74,
        speed: (index % 2 === 0 ? 1 : -1) * (1.75 + (index % 5) * 0.22),
        baseOpacity: 0.72,
        baseScale: 0.26 + (index % 3) * 0.035,
        trails: Array.from({ length: 12 }, (_, trailIndex) => {
          const trail = new THREE.Mesh(
            sphereGeo,
            makeHotGlowMaterial(palette.space, 0.74, 2.18)
          );
          trail.material.depthTest = false;
          trail.renderOrder = 8;
          trail.userData.trailIndex = trailIndex + 1;
          mesh.add(trail);
          return trail;
        })
      };
      mesh.add(satellite);
      return satellite;
    });
    mesh.userData.spaceSatellites = satellites;
  }
  mesh.userData.baseScale = 1.248;
  mesh.userData.baseOpacity = 1;
  notesRoot.add(mesh);
  return mesh;
}

function makeHoldTriangleGeometry() {
  const shape = new THREE.Shape([
    new THREE.Vector2(0, 0.62),
    new THREE.Vector2(-0.54, -0.36),
    new THREE.Vector2(0.54, -0.36)
  ]);
  return new THREE.ShapeGeometry(shape);
}

function buildHoldParticleLayout(hitTime, endTime, localX, depthOffset, hitPosition, tailHitPosition) {
  const duration = Math.max(0.001, endTime - hitTime);
  const samples = [];
  let totalLength = 0;

  if (chartState.motionMode === "receiver-catch" && chartState.receiverTrajectory) {
    const sampleCount = Math.max(2, Math.ceil(duration / 0.025) + 1);
    let previousPoint = null;
    for (let index = 0; index < sampleCount; index += 1) {
      const progress = index / (sampleCount - 1);
      const time = THREE.MathUtils.lerp(hitTime, endTime, progress);
      const pose = chartState.receiverTrajectory.sample(time);
      const point = pointFromReceiverPose(pose, localX, depthOffset, new THREE.Vector3());
      if (previousPoint) totalLength += point.distanceTo(previousPoint);
      samples.push({ time, distance: totalLength });
      previousPoint = point;
    }
  } else {
    totalLength = Math.max(
      hitPosition.distanceTo(tailHitPosition),
      currentFlowSpeed() * duration
    );
  }

  const particleCount = Math.max(1, Math.ceil(totalLength * renderConfig.holdParticlesPerUnit));
  let sampleIndex = 1;
  return Array.from({ length: particleCount }, (_, index) => {
    const along = (index + 0.5) / particleCount;
    const targetDistance = totalLength * along;
    if (samples.length === 0) return { along, pathTime: null };
    while (sampleIndex < samples.length - 1 && samples[sampleIndex].distance < targetDistance) {
      sampleIndex += 1;
    }
    const from = samples[Math.max(0, sampleIndex - 1)];
    const to = samples[sampleIndex];
    const segmentLength = Math.max(0.000001, to.distance - from.distance);
    const segmentProgress = THREE.MathUtils.clamp((targetDistance - from.distance) / segmentLength, 0, 1);
    return {
      along,
      pathTime: THREE.MathUtils.lerp(from.time, to.time, segmentProgress)
    };
  });
}

function createHoldNoteMesh(kind = "middle", particleLayout = []) {
  const color = noteColor(kind);
  const group = new THREE.Group();
  const head = kind === "left" || kind === "right"
    ? createSideNoteMesh(kind)
    : kind === "top"
      ? createTopNoteMesh()
      : createNoteMesh(kind);
  const bodyParticles = particleLayout.map((placement, index) => {
    const triangle = new THREE.Mesh(
      holdTriangleGeo,
      makeHotGlowMaterial(color, 0.58, 1.88)
    );
    const radial = Math.sqrt(((index * 0.61803398875) % 1));
    const angle = ((index * 2.39996322973) + Math.sin(index * 5.17) * 0.45) % (Math.PI * 2);
    triangle.userData = {
      baseOpacity: 0.48 + (index % 4) * 0.055,
      radial,
      angle,
      along: placement.along,
      pathTime: placement.pathTime,
      scale: 0.22 + (index % 6) * 0.032,
      spin: (index % 2 === 0 ? 1 : -1) * (0.12 + (index % 9) * 0.019),
      orbitSpeed: 0.85 + (index % 11) * 0.055
    };
    return triangle;
  });
  notesRoot.remove(head);
  group.add(...bodyParticles, head);
  group.userData.bodyParticles = bodyParticles;
  group.userData.head = head;
  group.userData.holdRadiusScale = head.userData.baseScale * 1.8;
  group.userData.baseScale = 1;
  group.userData.baseOpacity = 1;
  notesRoot.add(group);
  return group;
}

function makeChevronGeometry(direction, width, height, thickness) {
  const sign = direction === "left" ? -1 : 1;
  const w = width * 0.5;
  const h = height * 0.5;
  const t = thickness;
  const points = [
    [-w, h],
    [w * 0.86, 0],
    [-w, -h],
    [-w + t, -h],
    [w * 0.86 - t * 1.55, 0],
    [-w + t, h]
  ].map(([x, y]) => new THREE.Vector2(x * sign, y));
  const shape = new THREE.Shape(points);
  return new THREE.ShapeGeometry(shape);
}

function makeTopArrowGeometry(width, height) {
  const w = width * 0.5;
  const h = height * 0.5;
  const shape = new THREE.Shape([
    new THREE.Vector2(-w, -h * 0.62),
    new THREE.Vector2(-w, h * 0.26),
    new THREE.Vector2(-w * 0.16, h * 0.84),
    new THREE.Vector2(0, h),
    new THREE.Vector2(w * 0.16, h * 0.84),
    new THREE.Vector2(w, h * 0.26),
    new THREE.Vector2(w, -h * 0.62),
    new THREE.Vector2(0, -h * 0.02)
  ]);
  return new THREE.ShapeGeometry(shape);
}

function createLayeredArrowNote(geometry, color, haloSize = 3.8) {
  const group = new THREE.Group();
  const softHalo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: softHaloTexture,
    color,
    transparent: true,
    opacity: 0.48,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    depthWrite: false
  }));
  const outerGlow = new THREE.Mesh(geometry, makeHotGlowMaterial(color, 0.34, 2.85));
  const glow = new THREE.Mesh(geometry, makeHotGlowMaterial(color, 0.72, 2.6));
  const arrow = new THREE.Mesh(geometry, makeHotGlowMaterial(color, 0.99, 2.75));
  softHalo.scale.setScalar(haloSize);
  softHalo.userData.opacityScale = 0.48;
  outerGlow.scale.setScalar(1.58);
  outerGlow.position.z = -0.02;
  glow.scale.setScalar(1.3);
  glow.position.z = -0.01;
  outerGlow.userData.opacityScale = 0.34;
  glow.userData.opacityScale = 0.72;
  arrow.userData.opacityScale = 1;
  group.add(softHalo, outerGlow, glow, arrow);
  group.userData.baseScale = 1;
  group.userData.baseOpacity = 1;
  notesRoot.add(group);
  return group;
}

function createSideNoteMesh(direction) {
  const color = direction === "left" ? palette.left : palette.right;
  const geometry = makeChevronGeometry(direction, 1.25, 1.25, 0.3);
  return createLayeredArrowNote(geometry, color);
}

function createTopNoteMesh() {
  return createLayeredArrowNote(makeTopArrowGeometry(1.9, 1.35), palette.top, 4.2);
}

function baseNoteType(noteOrType) {
  const type = typeof noteOrType === "string" ? noteOrType : noteOrType.type;
  if (type === "hold" || type === "middleHold") return "middle";
  return type?.endsWith("Hold") ? type.slice(0, -4) : type;
}

function isHoldNote(noteOrType) {
  if (typeof noteOrType === "object" && noteOrType?.kind === "hold") return true;
  const type = typeof noteOrType === "string" ? noteOrType : noteOrType.type;
  return type === "hold" || type?.endsWith("Hold");
}

function isSpaceNote(noteOrType) {
  return baseNoteType(noteOrType) === "space";
}

function isMiddleNote(noteOrType) {
  return baseNoteType(noteOrType) === "middle";
}

function isTopNote(noteOrType) {
  return baseNoteType(noteOrType) === "top";
}

function isSpecialChordNote(noteOrType) {
  return isSpaceNote(noteOrType) || isTopNote(noteOrType);
}

function isSideNote(noteOrType) {
  const type = baseNoteType(noteOrType);
  return type === "left" || type === "right";
}

function noteColor(noteOrType) {
  const type = baseNoteType(noteOrType);
  if (type === "left") return palette.left;
  if (type === "right") return palette.right;
  if (isSpaceNote(type)) return palette.space;
  if (isTopNote(type)) return palette.top;
  return palette.white;
}

function holdKind(type) {
  return baseNoteType(type);
}

function isCentralNote(noteOrType) {
  const type = baseNoteType(noteOrType);
  return type === "middle" || type === "space";
}

function isPlayableNote(noteOrType) {
  return isCentralNote(noteOrType) || isSideNote(noteOrType) || isTopNote(noteOrType);
}

function defaultLocalXForType(type, lane, phase) {
  type = baseNoteType(type);
  if (type === "left") return -playfieldConfig.sideLaneX;
  if (type === "right") return playfieldConfig.sideLaneX;
  return laneX(lane, phase);
}

function removeDuplicateSpecialNotes(chartNotes) {
  const seenByTypeAndGroup = new Set();
  return chartNotes.filter((note) => {
    if (!isSpecialChordNote(note)) return true;
    const group = note.hitGroup ?? note.group ?? note.hitTime;
    const key = `${isSpaceNote(note) ? "space" : "top"}:${group}`;
    if (seenByTypeAndGroup.has(key)) return false;
    seenByTypeAndGroup.add(key);
    return true;
  });
}

function spawnNote(rawNote, index = 0) {
  const hitTime = rawNote.hitTime ?? rawNote.time ?? 0;
  const endTime = rawNote.endTime ?? rawNote.releaseTime ?? (rawNote.duration !== undefined ? hitTime + rawNote.duration : hitTime);
  const phase = ((hitTime ?? 0) / timingConfig.chartDuration) % 1;
  const lane = rawNote.lane ?? 0;
  const type = rawNote.type ?? "middle";
  const localX = isSpecialChordNote(type)
    ? 0
    : isPlayableNote(type)
      ? (rawNote.localX ?? rawNote.x ?? defaultLocalXForType(type, lane, phase))
      : 0;
  const depthOffset = isSpaceNote(type)
    ? -playfieldConfig.receiverRadius * playfieldConfig.specialNoteRadiusRatio
    : isTopNote(type)
      ? playfieldConfig.receiverRadius * playfieldConfig.specialNoteRadiusRatio
      : isSideNote(type)
        ? 0
        : randomDepthOffset();
  const followsReceiverTrajectory = chartState.motionMode === "receiver-catch"
    && chartState.receiverTrajectory;
  const hitPose = followsReceiverTrajectory
    ? chartState.receiverTrajectory.sample(hitTime)
    : null;
  const zone = hitPose
    ? zoneFromReceiverPose(hitPose)
    : createDropZone(rawNote.zone ?? rawNote, createDropZone());
  const hitPosition = followsReceiverTrajectory
    ? pointFromReceiverPose(hitPose, localX, depthOffset)
    : toVector3(
      rawNote.hitPosition ?? rawNote.targetPosition,
      localPointInZone(zone, localX, depthOffset)
    );
  const tailPose = followsReceiverTrajectory
    ? chartState.receiverTrajectory.sample(endTime)
    : null;
  const tailZone = tailPose
    ? zoneFromReceiverPose(tailPose, zone)
    : createDropZone(rawNote.tailZone ?? rawNote.endZone ?? rawNote.releaseZone ?? rawNote.zone ?? rawNote, zone);
  const tailHitPosition = followsReceiverTrajectory
    ? pointFromReceiverPose(tailPose, localX, depthOffset)
    : toVector3(
      rawNote.tailHitPosition ?? rawNote.endPosition ?? rawNote.releasePosition,
      localPointInZone(tailZone, localX, depthOffset)
    );
  const travelDistance = rawNote.travelDistance
    ?? zone.travelDistance
    ?? Math.abs((rawNote.startY ?? playfieldConfig.noteStartY) - playfieldConfig.noteHitY);
  const startPosition = toVector3(
    rawNote.startPosition,
    hitPosition.clone().sub(zone.fallDirection.clone().multiplyScalar(travelDistance))
  );
  const holdParticleLayout = isHoldNote(type)
    ? buildHoldParticleLayout(
      hitTime,
      endTime,
      localX,
      depthOffset,
      hitPosition,
      tailHitPosition
    )
    : null;
  const mesh = isHoldNote(type)
    ? createHoldNoteMesh(holdKind(type), holdParticleLayout)
    : isCentralNote(type)
      ? createNoteMesh(type)
      : isTopNote(type)
        ? createTopNoteMesh()
        : createSideNoteMesh(type);
  mesh.traverse((object) => {
    const materials = Array.isArray(object.material) ? object.material : [object.material];
    materials.forEach((material) => {
      if (material?.color && !material.userData.judgementBaseColor) {
        material.userData.judgementBaseColor = material.color.clone();
      }
    });
  });
  if (!isCentralNote(type)) mesh.quaternion.copy(zone.noteQuaternion);
  const note = {
    mesh,
    type,
    lane,
    hitTime,
    endTime,
    localX,
    wPos: rawNote.wPos ?? localX,
    depthOffset,
    zone,
    startPosition,
    hitPosition,
    tailHitPosition,
    scoreWeight: rawNote.scoreWeight ?? 1,
    hitGroup: rawNote.hitGroup ?? rawNote.group ?? `note-${index}`,
    pulse: Math.random() * 10,
    judged: false,
    hit: false,
    judgementStatus: "pending",
    judgement: null,
    earlyLoose: false,
    capturedAtChartTime: null,
    holdKeyCodes: new Set(),
    emptySinceChartTime: null
  };
  if (isHoldNote(note)) note.holdTrajectory = buildHoldTrajectory(note);
  notes.push(note);
}

function clearNotes() {
  notes.forEach((note) => {
    notesRoot.remove(note.mesh);
    note.mesh.traverse((object) => {
      object.material?.dispose?.();
    });
  });
  notes.length = 0;
  chartState.constellationEdges = [];
}

function buildConstellationEdges(chartNotes) {
  const notesByTime = new Map();
  chartNotes.forEach((note) => {
    if (!isMiddleNote(note)) return;
    if (!notesByTime.has(note.hitTime)) notesByTime.set(note.hitTime, []);
    notesByTime.get(note.hitTime).push(note);
  });

  const layers = [...notesByTime.entries()]
    .sort(([timeA], [timeB]) => timeA - timeB)
    .map(([, simultaneousNotes]) => {
      simultaneousNotes.sort((a, b) => (a.wPos ?? 0) - (b.wPos ?? 0));
      return simultaneousNotes.length === 1
        ? [simultaneousNotes[0]]
        : [simultaneousNotes[0], simultaneousNotes[simultaneousNotes.length - 1]];
    });

  const edges = [];
  for (let i = 0; i < layers.length - 1; i += 1) {
    const currentLayer = layers[i];
    const nextLayer = layers[i + 1];
    if (currentLayer.length === 2 && nextLayer.length === 2) {
      edges.push(
        { from: currentLayer[0], to: nextLayer[0] },
        { from: currentLayer[1], to: nextLayer[1] }
      );
    } else {
      currentLayer.forEach((from) => {
        nextLayer.forEach((to) => edges.push({ from, to }));
      });
    }
  }
  return Object.freeze(edges.map((edge) => Object.freeze(edge)));
}

function toVector3(value, fallback) {
  if (Array.isArray(value)) return new THREE.Vector3(value[0], value[1], value[2]);
  if (value && typeof value === "object") {
    return new THREE.Vector3(value.x ?? fallback.x, value.y ?? fallback.y, value.z ?? fallback.z);
  }
  return fallback.clone();
}

function applyChartSettings(chart) {
  if (chart.timing) Object.assign(timingConfig, chart.timing);
  if (chart.playfield) Object.assign(playfieldConfig, chart.playfield);
  chartState.motionMode = chart.motionMode ?? chart.motion?.mode ?? "notes-fall";
  chartState.flowSpeedTimeline = normalizeTimeline(
    chart.timelines?.FlowSpeed ?? chart.timelines?.flowSpeed ?? [],
    timingConfig.flowSpeed
  );
  chartState.cameraTimelines = {
    x: normalizeTimeline(chart.timelines?.CameraX ?? chart.timelines?.CamX ?? [], 0),
    y: normalizeTimeline(chart.timelines?.CameraY ?? chart.timelines?.CamY ?? [], 0),
    z: normalizeTimeline(chart.timelines?.CameraZ ?? chart.timelines?.CamZ ?? [], 0),
    targetX: normalizeTimeline(chart.timelines?.CameraTargetX ?? [], 0),
    targetY: normalizeTimeline(chart.timelines?.CameraTargetY ?? [], 0),
    targetZ: normalizeTimeline(chart.timelines?.CameraTargetZ ?? [], 0),
    fov: normalizeTimeline(chart.timelines?.CameraFov ?? [], 0)
  };
  const receiverSourceEvents = chart.receiverMotion
    ? buildReceiverEventsFromMotion(chart.receiverMotion, timingConfig.chartDuration)
    : chart.receiverEvents ?? [];
  const receiverTimeline = buildReceiverTimeline(receiverSourceEvents);
  chartState.receiverTrajectory = createReceiverTrajectory(
    receiverTimeline.events,
    receiverTimeline.transitions,
    timingConfig.chartDuration
  );
  if (chart.camera) {
    const cameraSettings = chart.camera;
    cameraProfile.fov = cameraSettings.fov ?? cameraProfile.fov;
    cameraProfile.near = cameraSettings.near ?? cameraProfile.near;
    cameraProfile.far = cameraSettings.far ?? cameraProfile.far;
    cameraProfile.position.copy(toVector3(cameraSettings.position, cameraProfile.position));
    cameraProfile.lookAt.copy(toVector3(cameraSettings.target ?? cameraSettings.lookAt, cameraProfile.lookAt));
    applyCameraProfile();
    controls.target.copy(cameraProfile.lookAt);
    controls.update();
  }
}

function makeFallbackJacket(seed = "ParticleSoar") {
  const size = 256;
  const cover = document.createElement("canvas");
  cover.width = size;
  cover.height = size;
  const context = cover.getContext("2d");
  const hash = [...seed].reduce((value, character) => ((value * 31) + character.charCodeAt(0)) >>> 0, 7);
  const hue = hash % 360;

  context.fillStyle = `hsl(${(hue + 215) % 360} 38% 8%)`;
  context.fillRect(0, 0, size, size);
  context.translate(size / 2, size / 2);
  context.rotate((hash % 19 - 9) * Math.PI / 180);
  for (let i = 0; i < 7; i += 1) {
    const radius = 30 + i * 18;
    context.strokeStyle = `hsla(${(hue + i * 17) % 360} 88% ${62 + i * 2}% / ${0.78 - i * 0.07})`;
    context.lineWidth = i % 2 === 0 ? 11 : 4;
    context.beginPath();
    context.arc(0, 0, radius, -Math.PI * 0.82 + i * 0.12, Math.PI * 0.7 + i * 0.08);
    context.stroke();
  }
  context.fillStyle = "rgba(238, 250, 255, 0.92)";
  context.fillRect(-8, -96, 16, 192);
  return cover.toDataURL("image/png");
}

function applyChartMetadata(chart) {
  const meta = chart.meta ?? {};
  const metaDefaults = CONFIG.chart.defaults.meta;
  const title = meta.title ?? metaDefaults.title;
  const composer = meta.composer ?? meta.artist ?? metaDefaults.composer;
  const difficultyName = String(meta.difficultyLabel ?? meta.difficulty?.name ?? metaDefaults.difficultyLabel)
    .trim()
    .replace(/^-+|-+$/g, "") || metaDefaults.difficultyLabel;
  const difficultyLevel = meta.level ?? meta.difficulty?.level ?? "--";
  const jacket = meta.jacket ?? makeFallbackJacket(title);

  songTitleReadout.textContent = title;
  songComposerReadout.textContent = composer;
  songJacket.setAttribute("aria-label", `${title} jacket`);
  songJacket.style.backgroundImage = `url(${JSON.stringify(jacket)})`;
  difficultyNameReadout.textContent = meta.difficultyText ?? `-${difficultyName}-`;
  difficultyLevelReadout.textContent = meta.difficultyText ? "" : difficultyLevel;
  difficultyBadge.setAttribute("aria-label", `Chart difficulty: ${difficultyName} ${difficultyLevel}`);
}

function loadChart(chart) {
  if (chart?.format === CHART_FORMAT) chart = chartForGame(chart);
  chartState.startTime = clock?.getElapsedTime?.() ?? 0;
  chartState.chartTime = 0;
  cameraMount.configured = false;
  applyChartSettings(chart);
  applyChartMetadata(chart);
  const initialReceiverState = sampleReceiverPose(0);
  configureCameraMount(initialReceiverState);
  receiverState.currentPosition.copy(initialReceiverState.position);
  receiverState.currentQuaternion.copy(initialReceiverState.quaternion);
  receiverState.anchor.copy(receiverState.currentPosition);
  syncPlayfieldVisuals();
  rebuildEditorRoutes();
  clearNotes();
  removeDuplicateSpecialNotes(chart.notes).forEach((note, index) => spawnNote(note, index));
  gameplayState.weightedNoteCount = Math.max(
    notes.reduce((total, note) => total + Math.max(0, Number(note.scoreWeight) || 0), 0),
    1
  );
  chartState.constellationEdges = buildConstellationEdges(notes);
  resetGameplayState();
  rebuildBackgroundField();
}

function createDemoChart() {
  const beatCount = 32;
  const duration = 11.2;
  const chartNotes = [];
  const receiverMotion = {
    values: [0, 1.0, 20],
    azimuthVelocity: 0.42,
    sampleSeconds: 0.04,
    origin: [0, playfieldConfig.noteHitY, 0]
  };

  const tripleHitTime = 1.05;
  const tripleGroup = "triple-hold-space-test";
  [
    { type: "hold", localX: -2.8, endTime: tripleHitTime + 1.25 },
    { type: "spaceHold", localX: 0, endTime: tripleHitTime + 1.05 },
    { type: "top" },
    { type: "middle", localX: 2.8 }
  ].forEach((note, lane) => {
    chartNotes.push({
      ...note,
      lane,
      hitTime: tripleHitTime,
      hitGroup: tripleGroup,
      wPos: note.localX
    });
  });

  for (let i = 0; i < beatCount; i += 1) {
    const phrase = i % 4;
    const hitTime = 0.45 + (i / beatCount) * duration;
    const phase = hitTime / duration;
    const hitGroup = `g-${i}`;
    const add = (lane) => {
      const localX = laneX(lane, phase);
      const isHold = i % 8 === 5;
      const isSpaceHold = isHold && i % 16 === 13;
      const isSpace = !isHold && i % 6 === 4;
      chartNotes.push({
        type: isSpaceHold ? "spaceHold" : isHold ? "hold" : isSpace ? "space" : "middle",
        lane,
        localX,
        hitTime,
        ...(isHold ? { endTime: Math.min(hitTime + 0.9, duration - 0.15) } : {}),
        hitGroup
      });
    };
    if (phrase === 0) {
      add((i + 1) % 6);
    } else if (phrase === 2) {
      add((i + 3) % 6);
    } else if (phrase === 1) {
      add(i % 6);
      add((i + 2) % 6);
    } else {
      add(i % 6);
    }

    if (phrase === 3) {
      chartNotes.push({
        type: i % 8 === 3 ? "left" : "right",
        hitTime,
        hitGroup
      });
    }
    if (i % 8 === 2) {
      chartNotes.push({ type: "top", hitTime, hitGroup });
    }
  }
  return {
    meta: {
      title: "ORBITAL ASCENT",
      composer: "ParticleSoar Sound Team",
      charter: "ParticleSoar Chart Team",
      illustrator: "ParticleSoar Visual Team",
      difficultyLabel: "HS",
      level: 67,
      format: "ParticleSoarChart/v0"
    },
    motionMode: "receiver-catch",
    receiverMotion,
    timing: { ...timingConfig, chartDuration: duration },
    playfield: { ...playfieldConfig },
    timelines: { FlowSpeed: [] },
    notes: chartNotes
  };
}

function makeEllipseTubeGeometry(radiusX, radiusY, tubeRadius) {
  const points = [];
  const segments = 192;
  for (let i = 0; i < segments; i += 1) {
    const a = (i / segments) * Math.PI * 2;
    points.push(new THREE.Vector3(Math.cos(a) * radiusX, 0, Math.sin(a) * radiusY));
  }
  const curve = new THREE.CatmullRomCurve3(points, true, "centripetal");
  return new THREE.TubeGeometry(curve, segments, tubeRadius, 8, true);
}

function writeSideTrajectoryGeometry(rail, worldPoints, pointCount) {
  const positions = rail.userData.positions;
  let offset = 0;
  for (let i = 0; i < pointCount - 1; i += 1) {
    positions[offset++] = worldPoints[i].x;
    positions[offset++] = worldPoints[i].y;
    positions[offset++] = worldPoints[i].z;
    positions[offset++] = worldPoints[i + 1].x;
    positions[offset++] = worldPoints[i + 1].y;
    positions[offset++] = worldPoints[i + 1].z;
  }
  rail.geometry.setDrawRange(0, (pointCount - 1) * 2);
  rail.geometry.getAttribute("position").needsUpdate = true;
}

function updateSideTrajectories(chartTime) {
  const horizon = timingConfig.staticNoteLeadSeconds + 0.45;
  const remainingChartTime = Math.max(0.001, timingConfig.chartDuration - chartTime);
  const sampledHorizon = Math.min(horizon, remainingChartTime);
  sideTrajectorySampleCount = Math.max(
    2,
    Math.min(
      sideTrajectoryPointCount,
      Math.ceil(sideTrajectoryPointCount * sampledHorizon / horizon)
    )
  );

  for (let i = 0; i < sideTrajectorySampleCount; i += 1) {
    const sampleTime = chartTime + sampledHorizon * i / Math.max(1, sideTrajectorySampleCount - 1);
    const trajectoryTime = Math.min(sampleTime, timingConfig.chartDuration - 0.0001);
    const pose = sampleReceiverPose(trajectoryTime);
    pointFromReceiverPose(
      pose,
      -playfieldConfig.sideLaneX,
      0,
      leftTrajectoryWorldPoints[i]
    );
    pointFromReceiverPose(
      pose,
      playfieldConfig.sideLaneX,
      0,
      rightTrajectoryWorldPoints[i]
    );
  }

  writeSideTrajectoryGeometry(leftRail, leftTrajectoryWorldPoints, sideTrajectorySampleCount);
  writeSideTrajectoryGeometry(rightRail, rightTrajectoryWorldPoints, sideTrajectorySampleCount);
}

function spawnHitEffect(note) {
  const color = noteColor(note);
  const origin = note.hitPosition;
  const axisA = note.zone.judgeLineDirection;
  const axisB = note.zone.depthDirection;
  const fallAxis = note.zone.fallDirection;
  const spawnedAt = clock.getElapsedTime();

  for (let i = 0; i < renderConfig.hitParticlesPerBurst; i += 1) {
    const particle = hitEffectParticles[nextHitParticleIndex];
    nextHitParticleIndex = (nextHitParticleIndex + 1) % hitEffectParticles.length;
    const angle = (i / renderConfig.hitParticlesPerBurst) * Math.PI * 2 + (Math.random() - 0.5) * 0.34;
    const speed = 2.8 + Math.random() * 3.4;
    const data = particle.userData;
    data.active = true;
    data.spawnedAt = spawnedAt;
    data.duration = 0.42 + Math.random() * 0.22;
    data.baseScale = 0.15 + Math.random() * 0.2;
    data.baseOpacity = 0.68 + Math.random() * 0.3;
    data.origin.copy(origin);
    data.velocity
      .copy(axisA).multiplyScalar(Math.cos(angle) * speed)
      .addScaledVector(axisB, Math.sin(angle) * speed)
      .addScaledVector(fallAxis, (Math.random() - 0.5) * 0.65);
    data.spin = (Math.random() < 0.5 ? -1 : 1) * (2.5 + Math.random() * 4.5);
    data.rotation = Math.random() * Math.PI * 2;
    particle.material.color.copy(color).multiplyScalar(2.2);
    particle.material.opacity = data.baseOpacity;
    particle.position.copy(origin);
    particle.visible = true;
  }
}

function updateHitEffects(t) {
  hitEffectParticles.forEach((particle) => {
    const data = particle.userData;
    if (!data.active) return;
    const age = t - data.spawnedAt;
    const progress = age / data.duration;
    if (progress >= 1) {
      data.active = false;
      particle.visible = false;
      return;
    }
    const travel = age * (1 - progress * 0.28);
    particle.position.copy(data.origin).addScaledVector(data.velocity, travel);
    particle.quaternion.copy(camera.quaternion);
    particle.rotateZ(data.rotation + age * data.spin);
    particle.scale.setScalar(data.baseScale * (1 + progress * 0.45));
    particle.material.opacity = data.baseOpacity * Math.pow(1 - progress, 1.7);
  });
}
