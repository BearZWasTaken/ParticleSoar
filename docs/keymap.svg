  <g transform="translate(327 386)"><rect class="key space" width="620" height="58" rx="5"/><text class="label" x="310" y="29">SPACE</text><rect class="bar-space" y="52" width="620" height="6"/></g>

  <g transform="translate(55 488)" filter="url(#glow)">
    <circle class="bar-left" cx="8" cy="8" r="7"/><text class="small" x="24" y="13">LEFT</text>
    <circle class="bar-middle" cx="128" cy="8" r="7"/><text class="small" x="144" y="13">MIDDLE</text>
