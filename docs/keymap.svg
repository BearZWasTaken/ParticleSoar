<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .bg{fill:#05090f}.key{stroke:#8a9aaa;stroke-width:1.5}.label{fill:#f2f7fb;font:600 21px system-ui;text-anchor:middle;dominant-baseline:middle}.small{fill:#93a4b2;font:15px system-ui}.title{fill:#f2f7fb;font:700 28px system-ui}.sub{fill:#93a4b2;font:16px system-ui}.left{fill:#1784a6}.middle{fill:#687987}.right{fill:#b6356d}.top{fill:#39866a}.space{fill:#b79334}.off{fill:#111923}.bar-left{fill:#70dcff}.bar-middle{fill:#eaf3f7}.bar-right{fill:#ff70aa}.bar-top{fill:#9af2c5}.bar-space{fill:#ffd66b}
    </style>
    <g id="k"><rect class="key" width="72" height="58" rx="5"/></g>
  </defs>
  <rect class="bg" width="1400" height="560"/>
  <text class="title" x="55" y="50">ParticleSoar KEY MAP</text>
  <text class="sub" x="55" y="80">Key fill = first judgement priority · bottom strips = every accepted note type</text>

